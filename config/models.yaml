    model: openai/gpt-6-luna
    reasoning_effort: low
  checker:  # also maps examine requests to findings; medium: low missed matches at M1
    model: openai/gpt-6-luna
    reasoning_effort: medium
  grader:
    model: openai/gpt-6.1-sol
    reasoning_effort: high
