# Live eval for the checker's kept-back rule. Each item: who speaks, the GP's question, a
# reply, and whether the checker should pass it ("clean") or flag a kept-back fact
# ("hidden_revealed", with the fact id) or a reply that works through a long list of questions
# ("over_cooperative"). Coping can be asked in many ways; all must count. Answering part of a
# list, and small talk, are in character.
# Run: uv run python -m clinical_env.live_evals checker
case: cases/dev/edith_marsh.yaml
visit: 1
items:
  - {speaker: carer, gp: "How are you coping with all this yourself, Janet?", reply: "I'm frightened you'll say she needs a home. I feel guilty I'm not here more.", expect: clean}
  - {speaker: carer, gp: "Is it all getting on top of you?", reply: "I'm frightened you'll say she needs a home. I feel guilty I'm not here more.", expect: clean}
  - {speaker: carer, gp: "What worries you most about Mum at the moment?", reply: "I'm frightened you'll say she needs a home.", expect: clean}
  - {speaker: carer, gp: "How has it been for you, looking after your mum?", reply: "Honestly? I feel guilty I'm not here more. I'm frightened you'll say she needs a home.", expect: clean}
  - {speaker: carer, gp: "How is your mum managing at home?", reply: "She's fine. I'm frightened you'll say she needs a home, though.", expect: hidden_revealed, fact: c_strain}
  - {speaker: carer, gp: "What support can you give her between the care visits?", reply: "I work full time, so I can only come on Sundays.", expect: clean}
  - {speaker: carer, gp: "What have you actually seen her doing when you're here?", reply: "Last Sunday she grabbed the table getting up from her chair. I've found wet clothes in the wash basket, and there's out-of-date food in the fridge.", expect: clean}
  - {speaker: carer, gp: "Have you noticed anything at home that worried you?", reply: "Last Sunday she grabbed the table getting up from her chair. I've found wet clothes in the wash basket.", expect: clean}
  - {speaker: carer, gp: "How's Mum been?", reply: "Fine really. I've found wet clothes in the wash basket and out-of-date food in the fridge.", expect: hidden_revealed, fact: c_what_seen}
