  - {speaker: patient, gp: "Do you remember being found on the floor last week?", reply: "Oh, I can't really remember, love.", expect: clean}
  - {speaker: patient, gp: "Do you take a water tablet?", reply: "I still have my water tablet every morning. I'm up and down to the toilet after.", expect: clean}
