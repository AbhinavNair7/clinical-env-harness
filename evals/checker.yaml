  - {speaker: patient, gp: "How are you feeling today?", reply: "Oh, not bad, love. Doreen next door popped her head over the fence yesterday for a natter. She's not well herself.", expect: clean}
  - {speaker: patient, gp: "How have you been sleeping?", reply: "Oh, all right, love. It's been ever so cold this week, hasn't it? I had my quiz shows on all afternoon.", expect: clean}
