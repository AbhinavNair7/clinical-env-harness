      accuracy: "true"
      disclosure: if_asked
    - id: p_walk
      truth: t_falls
      statement: "I've given up my morning walk for now. I hold on to the walls in the house."
      accuracy: "true"
      disclosure: if_asked
    - id: p_memory
      truth: t_function
      statement: "My memory's fine. I do the crossword every morning."
      accuracy: "true"
      disclosure: if_asked
    - id: p_alcohol
      truth: t_background
      statement: "A beer on Fridays. I haven't felt like one lately. Never smoked."
      accuracy: "true"
      disclosure: if_asked
    - id: p_mood
      truth: t_background
      statement: "I'm fine. It's June I worry about."
      accuracy: "true"
      disclosure: if_asked
    - id: p_help
      truth: t_background
      statement: "I don't have help and I don't need it. My daughter's in Tucson; she calls Sundays."
      accuracy: "true"
      disclosure: if_asked
    - id: p_wishes
      truth: t_driving
      statement: "I just want to get back to normal so I can keep seeing June."
      accuracy: "true"
      disclosure: if_asked
    # Small talk.
    - id: p_machinist
      truth: t_background
