      truth: t_v2_status
      from_visit: 2
      statement: "Still wobbly. The double vision comes and goes. No fits, if that's what you're asking."
      accuracy: "true"
      disclosure: volunteered
    - id: p2_bottles
      truth: t_v2_status
      from_visit: 2
