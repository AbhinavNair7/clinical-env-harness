personas:
  patient:
    name: Harold Benning
    age: 83
    cognition: Normal; a little slow when drowsy.
    health_literacy: >
      Good. Reads his labels; knows phenytoin as "my seizure pill" and calls the new ones
      "the heart pills"; does not know their names.
    agenda: >
      Wants the dizziness fixed so he can keep driving to see his wife every day; afraid of
      being told to stop driving, so plays things down.
    speech_style: Dry, matter-of-fact, a little gruff; short sentences; jokes to deflect.
    interjection: never
    traits: [denies_minimises]

conflicts:
  - id: cf_med_list
    facts: [g_meds, p_same_pills, p_new_heart, r_amiodarone, r_apixaban]
    truth: [t_new_meds, t_apixaban_interaction]
    expected_behaviour: >
      Do not rely on the chart's medicine list or "same pills as always": the cardiology note,
      the fill history and the bottles show amiodarone, apixaban and meclizine, but not when
      they started. Ask, and line the new amiodarone (last month) up with the start of the
      symptoms.
  - id: cf_level
    facts: [g_level_old, p_boat]
    truth: [t_phenytoin_toxic]
    expected_behaviour: >
      Do not take last year's normal phenytoin level as reassurance after a new interacting
      medicine; check a level.
  - id: cf_vertigo
    facts: [g_bppv, u_dx, p_not_spinning]
    truth: [t_vertigo_label]
    expected_behaviour: >
      Do not carry forward the urgent care "vertigo, likely BPPV": nothing spins, the
      imbalance is constant, and he has double vision and nystagmus both ways.

