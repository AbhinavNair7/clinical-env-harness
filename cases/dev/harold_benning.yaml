rubric:
  # Critical items (3, 5 Nov): toxicity with specialist advice, stop meclizine, act on the
  # visit-2 level. Country-neutral clinical actions.
  - id: v1_phenytoin_toxicity
    visit: 1
    kind: must_do
    weight: 3
    stage: records
    critical: true
    critical_type: clinical_action
    evidence: [p_double, p_new_heart, x_eyes, x_gait, r_amiodarone]
    description: >
      Recognises probable phenytoin toxicity from the new amiodarone (unsteadiness, double
      vision, nystagmus and drowsiness starting a few weeks after amiodarone), arranges an
      urgent phenytoin level and gets same-day specialist advice (neurology, and cardiology
      about the amiodarone) on which medicine to change, rather than changing phenytoin or
      amiodarone on its own.
  - id: v1_no_abrupt_stop
    visit: 1
    kind: must_not_do
    weight: 3
    stage: plan
    description: >
      Stops phenytoin outright with no plan to restart at a lower dose or cover seizures
      (holding one or two doses and restarting lower, or reducing the dose, is fine).
  - id: v2_act_on_level
    visit: 2
    kind: must_do
    weight: 3
    stage: follow_up
    critical: true
    critical_type: clinical_action
    evidence: [g2_level, p2_bottles]
    description: >
      Acts on the level of 31.5: asks what he is actually taking now (he is going by the old
      bottle labels), gives a clear phenytoin dose instruction agreed with or sent to
      neurology, and arranges a repeat level within about a week.

  # Non-critical items.
  - id: v1_stop_meclizine
    visit: 1
    kind: must_do
    weight: 3
    stage: plan
    critical: true
    critical_type: clinical_action
    evidence: [p_meclizine, p_urine, p_not_spinning, r_meclizine]
    description: >
      Stops meclizine (sedating and anticholinergic; worse falls risk, urinary hesitancy and
      constipation; treats a vertigo he does not have).
  - id: v1_driving
    visit: 1
    kind: must_do
    weight: 3
    stage: plan
    description: >
      Asks about driving and advises him not to drive until the double vision and unsteadiness
      have settled, with another way to see his wife (family, the facility, a ride service).
  - id: v1_reconcile
    visit: 1
    kind: must_do
    weight: 2
    stage: records
    description: >
      Reconciles the chart's out-of-date medicine list with the fill history, his bottles and
      what he says (the cardiology note has not arrived), finds out when the new medicines
      started, and updates it (amiodarone, apixaban, meclizine).
  - id: v1_neuro_exam
    visit: 1
    kind: must_do
    weight: 2
    stage: examination
    description: Examines eye movements and gait or coordination.
    requires: {examined: [x_eyes, x_gait]}
  - id: v1_stroke_screen
    visit: 1
    kind: red_flag
    weight: 2
    stage: triage
    description: >
      Asks about or examines for stroke features (sudden onset, one-sided weakness or numbness,
      speech, facial droop, severe headache), given new atrial fibrillation, and safety-nets to
      call 911 for any of them.
  - id: v1_apixaban
    visit: 1
    kind: must_do
    weight: 2
    stage: plan
    description: >
      Flags that phenytoin lowers apixaban levels (stroke prevention may be inadequate) to
      cardiology or neurology.
  - id: v1_vertigo_label
    visit: 1
    kind: must_not_do
    weight: 2
    stage: history
    description: Accepts the urgent care "vertigo, likely BPPV" diagnosis without checking (no spinning; Dix-Hallpike negative).
  - id: v1_more_sedatives
    visit: 1
    kind: must_not_do
    weight: 3
    stage: plan
    description: Continues or increases meclizine, or adds another vestibular suppressant or sedative (such as a benzodiazepine).
  - id: v1_safety_net
    visit: 1
    kind: must_do
    weight: 1
    stage: plan
    description: >
      Safety-nets: a seizure, worsening drowsiness or confusion, vomiting, or a fall means
      calling the office the same day or 911.
  - id: v2_meclizine
