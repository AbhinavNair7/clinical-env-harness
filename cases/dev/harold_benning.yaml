# Development case built on an open case report (CC BY; provenance and changes in
# sources/provenance/harold_benning.yaml, never shown to a model). Fictional: every person,
# place and institution is invented. Development only: never counted in the pilot.
# Drafted by the agent for the clinical lead to check, correct and add primary care detail to.
id: harold_benning
title: Harold Benning - "vertigo" that is a new heart pill raising an old seizure pill
country: us
messiness: mild
notes: >
  Phenytoin toxicity from an interaction: cardiology started amiodarone 35 days before visit 1
  for new atrial fibrillation and his phenytoin level, stable for years, rose over the
  following weeks. Urgent care called it vertigo and added meclizine (a prescribing cascade).
  The chart's medicine list predates cardiology and the cardiology letter has not arrived at
  visit 1 (it arrives before visit 2); the 30-day fill history and his bottles show the new
  medicines but not when they started, so the timing has to be asked (changed 5 Nov after
  The clinical lead's review). Phenytoin also lowers apixaban levels. He lives
  alone, drives daily to see his wife, and plays things down to keep driving. Visit 2 is a
  phone call when the neurology clinic's annual level (drawn 5 days before visit 1) arrives.

patient:
  name: Harold Benning
  age: 83
  summary: >
    Lives alone in a one-floor condo; his wife lives in memory care nearby. Epilepsy
    (seizure-free for years on phenytoin), hypertension, enlarged prostate. Seen by
    cardiology last month.

hidden_truth:
  - id: t_phenytoin_toxic
    category: medicines
    statement: >
      Phenytoin toxicity. Phenytoin extended-release 300 mg at bedtime, level 14.2 (range 10 to
      20) a year ago and stable for years. Amiodarone, started 35 days before visit 1 (200 mg
      twice daily for 2 weeks, then 200 mg daily), slowly inhibits its metabolism. From about 14 days ago: unsteadiness ("like walking on a boat"),
      double vision on looking to the side, sleepiness, mild nausea. The neurology clinic's
      annual level, drawn 5 days before visit 1, is 31.5 (reaches the chart after visit 1).
      Holding a dose or two and restarting phenytoin at a lower dose with neurology (small
      changes have large effects), or a different rhythm or rate drug with cardiology, would
      fix it. Stopping phenytoin outright risks seizures.
  - id: t_new_meds
    category: medicines
    statement: >
      His real medicines: phenytoin extended-release 300 mg at bedtime, lisinopril 10 mg daily,
      tamsulosin 0.4 mg at night, atorvastatin 10 mg at night, and since cardiology 35 days ago
      amiodarone 200 mg daily (twice daily for the first 2 weeks) and apixaban 5 mg twice daily; since urgent care 8 days ago
      meclizine 25 mg two or three times a day. He takes them from the bottles, by the labels.
  - id: t_vertigo_label
    category: other
    statement: >
      No vestibular cause. Nothing spins; the dizziness is imbalance, there all the time, worse
      walking, not brought on by turning his head. Urgent care labelled it "vertigo, likely
      BPPV" without a positional test; Dix-Hallpike is negative.
  - id: t_meclizine
    category: medicines
    statement: >
      Meclizine (anticholinergic, sedating) has not helped; it makes him drowsier, gives him a
      dry mouth and constipation, and his urine stream is slower to start.
  - id: t_apixaban_interaction
    category: medicines
    statement: >
      Phenytoin, a strong enzyme inducer, lowers apixaban levels, so his stroke prevention may
      be inadequate. Cardiology's consult note (it reaches the chart only after visit 1) lists
      phenytoin but mentions neither interaction.
  - id: t_falls
    category: falls
    statement: >
      No falls. Several near-misses: caught himself on the kitchen counter, and stumbled on the
      steps at his wife's facility 4 days ago, grabbing the rail. Has stopped his morning walk.
  - id: t_driving
    category: risks
    statement: >
      Drives 10 minutes every day to have lunch with his wife. With double vision on side gaze
      and slowed reactions he is not safe to drive until this settles.
  - id: t_function
    category: adls
    statement: >
      Independent: cooks simple meals, does his laundry and manages his own medicines. Slower
      and holding the walls since the dizziness began. Normal cognition.
  - id: t_background
    category: other
    statement: >
      Focal epilepsy after a work injury in his forties; seizure-free since 2009; seen by
      neurology yearly. Atrial fibrillation found by cardiology last month after palpitations.
      Hypertension, enlarged prostate, hearing aids. Retired machinist. His wife June has
      Alzheimer's disease and lives in memory care at Willow Court. Their daughter lives in
      Tucson and calls on Sundays. A beer on Fridays; never smoked. Wants to keep seeing June
      every day.
  - id: t_stroke_screen
    category: risks
    statement: >
      No stroke features: gradual onset, both sides, no weakness, numbness, facial droop,
      speech change or severe headache. Gaze-evoked nystagmus both ways fits drug toxicity.
  - id: t_v2_status
    category: medicines
    from_visit: 2
    statement: >
      Day 4: no seizures, still unsteady with double vision on and off, still drowsy. He is
      taking his tablets as the bottle labels say (no new prescriptions picked up) and still
      takes meclizine when it is bad. He drove to see June yesterday.

