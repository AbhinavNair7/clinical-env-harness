    Patricia ELLISON   Female   Age 80   Usual GP: Dr R Bhatt

    PROBLEMS - ACTIVE
      Alzheimer's disease
      Essential hypertension
      Overactive bladder

    PROBLEMS - PAST / MINOR
      Hip replacement, right (2015)
      Hysterectomy (1988)
      Shingles (2021)

    REPEAT MEDICATION (last issued {day:-5})
      Donepezil 10mg tablets - one at night - 28 tablets
      Oxybutynin 5mg tablets - one twice a day - 56 tablets
      Amlodipine 5mg tablets - one each morning - 28 tablets

    CONSULTATIONS (most recent first)
      {entries}
      {day:-6}  Admin          [[g_op_note]]
      {day:-17}  OOH            [[g_ooh_fu]]
      {day:-21}  OOH            [[g_ooh]]
      {day:-70}  Telephone      [[g_oab]]
      {day:-150}  Nurse          Hypertension review. BP 136/78. Bloods normal. Husband attended with her.
      {day:-250}  Admin          Donepezil 10mg added to repeat per memory clinic.
      {day:-280}  Letter         [[g_memory]]
