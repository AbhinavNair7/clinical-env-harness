rubric:
- id: v1_oxybutynin
  visit: 1
  kind: must_do
  weight: 3
  stage: plan
  critical: true
  critical_type: clinical_action
  evidence:
  - c_since_tablets
  - p_mouth
  - x_4at
  - x_abdomen
  description: |
    Stops the oxybutynin (an anticholinergic in moderate dementia, started for urgency that donepezil may have caused, and likely worsening her confusion and constipation).
- id: v1_carer_cover
  visit: 1
  kind: must_do
  weight: 3
  stage: plan
  critical: true
  critical_type: clinical_action
  evidence:
  - g_op_note
  - c_operation
  requires:
    spoke_to:
    - carer
  description: |
    Finds out about Ken's knee replacement in under three weeks and starts arranging care for Pat while he is in hospital and recovering: a referral to adult social care for respite or a replacement care package (or an urgent carer's assessment with that aim) before the operation date.
- id: v2_cover_urgent
  visit: 2
  kind: must_do
  weight: 3
  stage: plan
  critical: true
  critical_type: clinical_action
  evidence:
  - c2_gary_no
  - c2_respite_ok
  description: |
    With the operation a week away and no one to look after Pat, arranges cover urgently: same-day or next-day contact with adult social care (the duty team) for emergency respite or a replacement care package before the operation.
- id: v1_constipation
  visit: 1
  kind: must_do
  weight: 2
  stage: plan
  description: Treats the constipation (a laxative, fluids) and plans to check it settles.
- id: v1_no_antibiotic
  visit: 1
  kind: must_not_do
  weight: 2
  stage: plan
  description: Gives antibiotics for a trace of leucocytes on the dipstick with no urinary symptoms.
- id: v1_cognition
  visit: 1
  kind: must_do
  weight: 1
  stage: examination
  description: Screens for delirium and cognition (4AT or similar).
  requires:
    examined:
    - x_4at
- id: v1_urgency_plan
  visit: 1
  kind: must_do
  weight: 2
  stage: plan
  description: |
    Plans for the urgency without an anticholinergic (continence assessment, timed toileting, pads, or a non-anticholinergic option), and considers donepezil as a cause.
- id: v1_no_swap
  visit: 1
  kind: must_not_do
  weight: 2
  stage: plan
  description: Swaps oxybutynin for another antimuscarinic (solifenacin, tolterodine, trospium, fesoterodine).
- id: v1_door
  visit: 1
  kind: must_do
  weight: 2
  stage: plan
  description: |
    Addresses night-time safety: the locked door with a hidden key is a fire risk (door sensor or telecare, key safe, fire service home safety visit).
- id: v1_carer_assessment
  visit: 1
  kind: must_do
  weight: 2
  stage: plan
  description: Offers Ken a carer's assessment and adds him to the carers register.
- id: v1_ken_wellbeing
  visit: 1
  kind: must_do
  weight: 1
  stage: history
  description: Asks how Ken is coping in himself, and responds supportively when he says he shouted at
    Pat.
  requires:
    spoke_to:
    - carer
- id: v1_family
  visit: 1
  kind: must_do
  weight: 1
  stage: history
  description: Asks about family or other support and learns about Gary.
- id: v2_preop
  visit: 2
  kind: must_do
  weight: 1
  stage: plan
  description: Advises Ken to tell the pre-op team that he is Pat's only carer (or contacts them).
- id: v2_care_home
  visit: 2
  kind: must_not_do
  weight: 2
  stage: plan
  description: Recommends permanent care home placement rather than short-term cover.
- id: v2_capacity
  visit: 2
  kind: must_do
  weight: 1
  stage: plan
  description: Considers Pat's own view and capacity about a short respite stay (best interests if she
    lacks it).
