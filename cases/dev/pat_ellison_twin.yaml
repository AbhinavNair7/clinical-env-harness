# base on 6 Nov (views copied, plus g_op_note); keep its views in step with the base.
# Fictional. Development only.
id: pat_ellison_twin
twin_of: pat_ellison
title: Pat Ellison (written twin) - the carer's operation is also in the GP record
messiness: mild
notes: Written twin for the people-not-paper test (DECISIONS 6 Nov). Same truth, personas and visits as
  pat_ellison; Ken's operation is also a reception note in the GP record, and the two minimising lines
  are made accurate (a twin has no conflicts). Criticals identical to the base.
views:
  patient:
  - id: p_fine
    truth: t_dementia
    statement: I'm a bit muddled, dear. Ken says I'm not myself.
    accuracy: 'true'
    disclosure: volunteered
  - id: p_toilet
    truth: t_cascade
    statement: I have to dash to the toilet. I don't always make it, I'm ashamed to say.
    accuracy: 'true'
    disclosure: if_asked
  - id: p_mouth
    truth: t_cascade
    statement: My mouth's like sandpaper. I keep a glass of water by me.
    accuracy: 'true'
    disclosure: hidden
    reveal_condition: asked about a dry mouth, thirst or side effects of her tablets
  - id: p_bowels
    truth: t_constipation
    statement: Oh, I couldn't tell you, dear. Ask Ken.
    accuracy: 'true'
    disclosure: if_asked
  - id: p_ken_leg
    truth: t_operation
    statement: Ken does everything. He's a good man. His leg's bad, you know. He won't make a fuss.
    accuracy: 'true'
    disclosure: if_asked
  - id: p_pain
    truth: t_dementia
    statement: No pain. I'm right as rain.
    accuracy: 'true'
    disclosure: if_asked
  - id: p_falls
    truth: t_dementia
    statement: I don't fall. I'm steady.
    accuracy: 'true'
    disclosure: if_asked
  - id: p_mood
    truth: t_dementia
    statement: Happy enough. I like my garden. The roses are lovely this year.
    accuracy: 'true'
    disclosure: if_asked
  - id: p_post_office
    truth: t_family
    statement: I ran the post office in the village for twenty years, you know. Everyone came in.
    accuracy: 'true'
    disclosure: volunteered
  carer:
  - id: c_infection
    truth: t_dementia
    statement: She went right off with that water infection. She's better than that now, but she's not
      right.
    accuracy: 'true'
    disclosure: volunteered
  - id: c_managing
    truth: t_strain
    statement: We get by. I do everything for her.
    accuracy: 'true'
    disclosure: volunteered
  - id: c_since_tablets
    truth: t_cascade
    statement: |
      Now you say it, she was getting more muddled before the infection. About when she started them bladder tablets. Her mouth's always dry and all.
    accuracy: 'true'
    disclosure: hidden
    reveal_condition: |
      asked when the confusion started, whether anything changed before the infection, or about her bladder tablets, new medicines or side effects
  - id: c_wet
    truth: t_cascade
    statement: She still has accidents. The bladder tablets haven't done much, to be honest.
    accuracy: 'true'
    disclosure: if_asked
  - id: c_bowels
    truth: t_constipation
    statement: Every four or five days, and she strains. She was regular as clockwork before.
    accuracy: 'true'
    disclosure: if_asked
  - id: c_tablets
    truth: t_cascade
    statement: I do her dosette every Sunday. The memory one at night, the bladder one twice a day, and
      her blood pressure one.
    accuracy: 'true'
    disclosure: if_asked
  - id: c_waterworks_now
    truth: t_uti
    statement: No burning now, no fever. Just the usual rushing to the toilet.
    accuracy: 'true'
    disclosure: if_asked
  - id: c_nights
    truth: t_night
    statement: |
      She's up two or three times a night. Last month she got out the front door in her nightie. I lock it now and hide the key.
    accuracy: 'true'
    disclosure: hidden
    reveal_condition: asked about nights, sleep, wandering, or her going out
  - id: c_lpa
    truth: t_family
    statement: Power of attorney? No. We never got round to it.
    accuracy: 'true'
    disclosure: if_asked
  - id: c_otc
    truth: t_family
    statement: Nothing from the shop. Just what's in the dosette.
    accuracy: 'true'
    disclosure: if_asked
  - id: c_eating
    truth: t_family
    statement: She eats what I put in front of her. She doesn't drink much unless I remind her.
    accuracy: 'true'
    disclosure: if_asked
  - id: c_washing
    truth: t_dementia
    statement: I help her wash and dress. She'll do her face and teeth if I prompt her.
    accuracy: 'true'
    disclosure: if_asked
  - id: c_walking
    truth: t_dementia
    statement: She gets about the house fine. No falls. It's the rushing to the loo.
    accuracy: 'true'
    disclosure: if_asked
  - id: c_tired
    truth: t_strain
    statement: I'm tired, I won't lie. I sleep in the chair by the door so I hear her.
    accuracy: 'true'
    disclosure: if_asked
  - id: c_operation
    truth: t_operation
    statement: |
      My knee's being done. The new knee. Two weeks on Thursday. They keep you in three or four nights, and then I can't drive for six weeks. I haven't worked out what happens to Pat.
    accuracy: 'true'
    disclosure: hidden
    reveal_condition: |
      asked about his own health, his leg, knee or walking, any hospital appointments or plans of his own, whether anything is coming up or changing, what support there is or who could step in if he were unwell or away, what worries him about the future, or whether there is anything else he wants to raise
  - id: c_why_quiet
    truth: t_operation
    statement: I didn't want a fuss. If social services come in, Gary will have her in a home. He's said
      as much.
    accuracy: 'true'
    disclosure: hidden
    reveal_condition: asked why he had not mentioned it, whether anyone knows, or what he is worried about
      if services get involved
  - id: c_snapped
    truth: t_strain
    statement: I shouted at her last week. I've never done that in twenty-two years. I felt terrible.
    accuracy: 'true'
    disclosure: hidden
    reveal_condition: asked how he is in himself, about his mood, or whether he ever feels he cannot cope
  - id: c_gary
    truth: t_family
    statement: Her son Gary's in Leeds. My stepson. He works. He thinks she should be in a home.
    accuracy: 'true'
    disclosure: if_asked
  - id: c_no_help
    truth: t_strain
    statement: No carers. We manage. I don't want strangers in the house.
    accuracy: 'true'
    disclosure: if_asked
  - id: c2_preop
    truth: t_v2
    from_visit: 2
    statement: |
      The nurse at the pre-op asked who'd look after Pat while I'm in. I told her Gary would. He won't. It's a week tomorrow.
    accuracy: 'true'
    disclosure: volunteered
  - id: c2_gary_no
    truth: t_v2
    from_visit: 2
    statement: I rang Gary. He says it's time she went in a home. He won't have her, not even for a week.
    accuracy: 'true'
    disclosure: hidden
    reveal_condition: asked who else could help, about family, or whether Gary could step in
  - id: c2_respite_ok
    truth: t_v2
    from_visit: 2
    statement: If it's just while I'm laid up, and she comes home after. Yes. I'd have that.
    accuracy: 'true'
    disclosure: hidden
    reveal_condition: asked whether he would accept respite, a short stay, or carers coming in
  - id: c2_nobody_rang
    truth: t_v2
    from_visit: 2
    statement: Nobody's rung me from anywhere. Not the council, nobody.
    accuracy: 'true'
    disclosure: if_asked
  gp_record:
  - id: g_memory
    truth: t_dementia
    statement: |
      Memory clinic: Alzheimer's disease, moderate. MMSE 18/30. Started donepezil 5mg at night, increase to 10mg after 4 weeks if tolerated. Discharged to GP care.
    accuracy: 'true'
  - id: g_oab
    truth: t_cascade
    statement: |
      Telephone (husband). Urinary urgency and incontinence for 3 months. Urine dip negative. Overactive bladder. Start oxybutynin 5mg BD. Review 6 weeks.
    accuracy: 'true'
  - id: g_ooh
    truth: t_uti
    statement: |
      Out of hours. Acute confusion for 2 days. Dip nitrites +, leucocytes ++. Probable UTI with delirium. Nitrofurantoin 100mg MR BD for 3 days. Husband to call if worse.
    accuracy: 'true'
  - id: g_ooh_fu
    truth: t_uti
    statement: 'Out of hours follow-up call: husband reports she is improving. GP review when settled.'
    accuracy: 'true'
  - id: g_op_note
    truth: t_operation
    accuracy: 'true'
    statement: Mr Ken Ellison (husband, main carer) told reception he is having a knee replacement at
      the County Hospital on {day:19} and asked whether someone will sort out Pat while he is in. Message
      to GP.
  pharmacy_record:
  - id: r_meds
    truth: t_cascade
    statement: 'Dispensed {day:-5}: donepezil 10mg x28, oxybutynin 5mg x56, amlodipine 5mg x28. Collected
      by husband.'
    accuracy: 'true'
documents:
