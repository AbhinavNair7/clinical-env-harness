      {day:-31}  Weekly blister pack dispensed. Morning: furosemide 40mg, amlodipine 10mg. Night: donepezil 10mg, atorvastatin 20mg.

  ambulance_report: |
    AMBULANCE SERVICE PATIENT REPORT (copy to GP)
    Incident {day:-9}. Call 07:56, on scene 08:41, left scene 09:50. Caller: care worker.
    History: [[m_fall]]
    Past history: hypertension, Alzheimer's disease, glaucoma. Recent admission after a fall.
    Medication: per blister pack. No anticoagulants.
    Obs: RR 16, SpO2 96% air, HR 78 regular, BP 134/76 sitting, temp 36.5, BM 6.4.
      GCS 15; unsure of the date, which the carer says is usual for her.
    12-lead ECG: sinus rhythm 76, no acute changes.
    Secondary survey: no head injury, no neck or hip pain, full range of movement all limbs.
      Skin intact. Stood with help of one and walked to her chair with a stick.
    Impression: mechanical fall, no injury.
    Disposition: not conveyed. Patient declined hospital; has capacity for this decision.
      Left in the care of the care worker. Worsening advice given. GP to consider falls referral.
    {day:9}  Further incident: [[m2_fall]]

record_traits:
  gp_record: [contradicts_other_records, outdated_entries, long_noisy]
  discharge_summary: [contradicts_other_records]
  care_agency_notes: [contradicts_other_records]

personas:
  patient:
    name: Edith Marsh
    age: 84
    cognition: Mild Alzheimer's disease. Forgets recent events but covers well socially.
    health_literacy: Low. Calls furosemide "my water tablet" and doesn't know the other names.
    agenda: Wants to stay in her own home and not be a bother. Plays down problems.
    speech_style: Warm and chatty; wanders off topic; calls people "love" now and then.
    interjection: sometimes
    traits: [denies_minimises, tangents, poor_recall]
  carer:
    name: Janet Price
    age: 56
    relationship: daughter
    cognition: Normal.
    health_literacy: Moderate. Trusts that the hospital and pharmacy have sorted things.
    agenda: Wants her mother to stay at home. Defensive if a care home is mentioned.
    speech_style: Brisk and plain-spoken (no pet names), a little defensive, speaks for her mother.
    interjection: always
    traits: [carer_dominates, denies_minimises]

conflicts:
  - id: cf_furosemide
    facts: [d_furosemide, g_meds, r_dosette, c_meds_sorted, p_water_tablet]
    truth: [t_furosemide]
    expected_behaviour: >
      Notice that the discharge summary stopped furosemide while the GP record and dosette
      still contain it; confirm she is taking it; stop it and get the dosette changed.
  - id: cf_falls
    facts: [p_no_falls, c_falls, g_falls, a_floor, d_fall, m_fall]
    truth: [t_falls]
    expected_behaviour: >
      Rely on the agency notes, ambulance report and discharge summary over Edith's recall;
      record two falls.
  - id: cf_function
    facts: [p_cooking, p_washing, c_managing_fine, a_meals, c_what_seen]
    truth: [t_adls]
    expected_behaviour: >
      Do not accept "managing fine"; ask Janet what she has actually seen and weigh it against
      the agency's observations.
  - id: cf_meds_taken
    facts: [p_tablets_fine, a_missed]
    truth: [t_missed_meds]
    expected_behaviour: Believe the agency record of missed evening doses.
  - id: cf_care
    facts: [g_care, a_short_calls]
    truth: [t_care_delivered]
    expected_behaviour: Recognise the care actually delivered is less than the GP record shows.
  - id: cf_eye_drops
    facts: [p_drops, c_drops]
    truth: [t_eye_drops]
    expected_behaviour: >
      Do not assume the separately supplied eye drops are given; find out who gives them.

visits:
  - number: 1
    day: 0
    setting: home_visit
    present: [patient, carer]
    turn_budget: 40  # soft: a penalty only past it; calibrate at M1 against a human run
    reason: >
      The care agency phoned the practice: Edith was found on the floor last week and is
      missing evening medicines. Janet is there for the visit.
    records_available: [gp_record, discharge_summary, care_agency_notes, pharmacy_record, ambulance_report]
    examination:
      - id: x_postural_bp
        label: Lying and standing blood pressure
        finding: "Lying 138/76, pulse 76 regular; standing 108/64, pulse 82 at 1 minute and 112/66, pulse 80 at 3 minutes; dizzy on standing."
      - id: x_gait
        label: Gait and mobility
        finding: "Rises from the chair at the second attempt, pushing up with her arms. Walks slowly with a stick, reaching for furniture; unsteady on turning. Does not use the walking frame."
      - id: x_general
        label: General appearance and hydration
        finding: "Thin; her cardigan and skirt hang loose. Food marks on her clothes, hair unwashed. Alert, chatty and pleasant. Lips a little dry."
      - id: x_home
        label: Home hazards
        finding: "Loose rug in the hallway; dim landing light; walking frame folded by the front door."
      - id: x_dosette
        label: Dosette and medicines in the home
        finding: "Morning slots hold furosemide 40 mg and amlodipine 10 mg; night slots hold donepezil 10 mg and atorvastatin 20 mg. Five of last week's seven night slots are still full. The latanoprost bottle by her bed was opened nine weeks ago and is still nearly full."
      - id: x_cognition
        label: Cognition screen
        finding: "6CIT 12 out of 28: wrong month, recalls 2 of 5 address items."
      - id: x_dix_hallpike
        label: Dix-Hallpike test
        finding: "Negative on both sides."
      - id: x_cardio
        label: Heart, chest and ankles
        finding: "Heart sounds normal, chest clear, no ankle oedema, JVP not raised."
      - id: x_bruising
        label: Skin and hips
        finding: "Old bruising over the left hip; no bony tenderness; full range of hip movement."
      # A set GPs ask for by name ("obs"); asking for one part gets that part alone.
      - id: x_obs
        label: Observations (pulse, blood pressure, temperature, respiratory rate, oxygen saturation)
        parts: [x_pulse, x_bp, x_temp, x_rr, x_sats]
      - id: x_pulse
        label: Pulse rate and rhythm
        finding: "Pulse 76 regular."
      - id: x_bp
        label: Blood pressure (sitting)
        finding: "Blood pressure 130/72 sitting."
      - id: x_temp
        label: Temperature
        finding: "Temperature 36.6 C."
      - id: x_rr
        label: Respiratory rate
        finding: "Respiratory rate 16."
      - id: x_sats
        label: Oxygen saturation
        finding: "Oxygen saturation 96% on air."
      - id: x_glucose
        label: Capillary blood glucose
        finding: "Capillary glucose 6.1 mmol/L."
      - id: x_alarm
        label: Pendant alarm
        finding: "Not being worn; not found in the living room or kitchen. The base unit is plugged in and working."
      - id: x_kitchen
        label: Kitchen, fridge and food
        finding: "Cooker cold with dust on the hob. Fridge holds out-of-date milk and ham. Two curled sandwiches from yesterday on the side. Little sign of meals being made."
  - number: 2
    day: 14
    setting: phone
    present: [carer]
    turn_budget: 20
    reason: Janet asked for a call back after her mother's fall.
    events_since_last:
      - >
        Edith fell at night going to the toilet 5 days ago and lay on the bathroom floor until
        the morning call. Paramedics found bruising only and left her at home.
      - The dosette was dispensed again 3 days ago with the same contents as before.
      - Janet stayed with her mother for the weekend after the fall.
    records_available: [gp_record, discharge_summary, care_agency_notes, pharmacy_record, ambulance_report]

rubric:
  # Critical items (4): medicines reconciliation, falls and function assessment, care package
  # review, and recognising visit-2 delirium. 4 Nov: care package review swapped in as critical
  # and asking the daughter made a weight-3 normal item (cap of 4; clinical lead's call).
  - id: v1_reconcile_meds
    visit: 1
    kind: must_do
    weight: 3
    stage: records
    critical: true
    critical_type: clinical_action
    evidence: [d_furosemide, g_meds, r_dosette, p_water_tablet, x_dosette]
    description: >
      Reconciles medicines across the discharge summary, GP record, dosette and what Edith
      takes; stops furosemide with a rationale (postural hypotension, falls, no heart
      failure) and arranges for the pharmacy to remove it from the dosette.
  - id: v1_falls_function
    visit: 1
    kind: must_do
    weight: 3
    stage: examination
    critical: true
    critical_type: clinical_action
    evidence: [x_postural_bp, x_gait, a_floor, p_no_falls, p_dizzy]
    description: >
      Falls and function assessment: checks lying and standing blood pressure and gait, and
      refers to the falls service or community physiotherapy and occupational therapy.
    requires: {examined: [x_postural_bp, x_gait]}
  - id: v2_confusion
    visit: 2
    kind: red_flag
    weight: 3
    stage: triage
    critical: true
    critical_type: clinical_action
    evidence: [c2_not_coping, c2_fever, c2_daytime]
    description: >
      Screens for acute illness (fever, breathlessness, chest pain, head injury, new pain,
      urinary symptoms, eating and drinking); recognises probable delirium after a long lie
      in someone living alone with an unreliable history; arranges a same-day face-to-face
      assessment (home visit), with 999 if red flags appear.
  - id: v1_care_package
    visit: 1
    kind: must_do
    weight: 3
    stage: plan
    critical: true
    critical_type: clinical_action
    evidence: [a_short_calls, a_missed, c_what_seen, p_bedtime]
    description: >
      Reviews whether the care package still fits (short, late evening calls; missed evening
      medicines; no lunch call) and requests a social care reassessment.

  # Non-critical items.
  - id: v1_ask_daughter
    visit: 1
    kind: must_do
    weight: 3
    stage: history
    description: >
      Asks Janet what she has actually seen rather than accepting "managing fine", and weighs
      it against the agency notes.
    requires: {spoke_to: [carer], read: [care_agency_notes]}
  - id: v1_amlodipine
    visit: 1
    kind: must_do
    weight: 1
    stage: plan
    description: Reviews amlodipine in light of the postural drop (reduce or stop, then recheck BP).
  - id: v1_alarm_hazards
    visit: 1
    kind: must_do
    weight: 1
    stage: plan
    description: Addresses the pendant alarm not being worn and the home hazards.
  - id: v1_evening_meds
    visit: 1
    kind: must_do
    weight: 2
    stage: plan
    description: >
      Plans for missed evening donepezil: moves it to the morning or asks for the call time
      to change.
  - id: v1_carer_assessment
    visit: 1
    kind: must_do
    weight: 1
    stage: plan
    description: Offers Janet a carer's assessment.
  - id: v1_open_ice
    visit: 1
    kind: must_do
    weight: 2
    stage: history
    description: >
      Opens with open questions and finds out what matters to Edith and Janet (ideas,
      concerns, expectations; Edith wants to stay at home) before narrowing down.
  - id: v1_ph_advice
    visit: 1
    kind: must_do
    weight: 1
    stage: plan
    description: >
      Gives conservative postural hypotension advice (stand up slowly, sit to dress, fluids)
      alongside the medicine changes.
  - id: v1_midodrine
    visit: 1
    kind: must_not_do
    weight: 2
    stage: plan
    description: Starts midodrine or fludrocortisone before stopping or reducing the culprit medicines.
  - id: v1_bppv
    visit: 1
    kind: must_not_do
    weight: 2
    stage: examination
    description: Puts her dizziness down to the old BPPV without checking lying and standing BP.
  - id: v1_continue_furosemide
    visit: 1
    kind: must_not_do
    weight: 3
    stage: plan
    description: Continues or restarts furosemide on the strength of the GP repeat list.
  - id: v1_care_home
    visit: 1
    kind: must_not_do
    weight: 2
    stage: plan
    description: Recommends a care home before a care reassessment and falls work-up.
  - id: v2_verify_change
    visit: 2
    kind: must_do
    weight: 3
    stage: follow_up
    description: >
      Checks whether furosemide is still in the dosette (pharmacy record or asks Janet to read
      the pods) instead of assuming the visit-1 change happened, and acts on it the same day.
  - id: v2_urgent_care
    visit: 2
    kind: must_do
    weight: 2
    stage: plan
    description: Requests an urgent social care review or short-term increase in care.
  - id: v2_phone_only
    visit: 2
    kind: must_not_do
    weight: 3
    stage: triage
    description: Manages the new confusion by phone alone, with no assessment arranged.
