# Pipeline test case from docs/build-v0.md. Fictional. Development only: never counted in the
# pilot. Clinical detail drafted by the agent for the clinical lead to check or replace.
id: edith_marsh
title: Edith Marsh - falls, a dosette nobody updated and a daughter who says she is fine
country: uk
messiness: moderate
notes: >
  Furosemide was stopped at discharge but the dosette still contains it. Visit 2 tests whether
  the clinician checks that the visit-1 change actually happened.
  Change log (realism fixes after M1 runs, 4 Nov): added observations and kitchen findings so
  "unremarkable" never contradicts the truth; split Janet's availability (not secret, it is
  in the briefing) from her fear of a care home (kept back). After the clinical lead's run-1 review:
  records written out as real documents (cluttered GP record, templated agency log, no BP
  numbers in the discharge summary, a paramedic report for the hallway fall; the agency told
  its office but not Janet, who does not know about that fall); small talk for Edith; a standard
  history for Edith and Janet; gait described without a timed up and go; a general
  appearance finding; a pendant alarm finding (unlisted, it read "unremarkable"). Visit 1 is
  day 0; records show dates relative to it.
  After the first M2 runs (4 Nov): Janet's visit-2 account of the second fall and where her
  mother is now (she denied any fall since the hospital, the visit-1 line still applied);
  "nothing since" and "managing fine" now end at visit 1; the summary no longer says
  "3 weeks ago", which was wrong at visit 2. The GP record marks where {entries} go.
  After the clinical lead's M2 read (4 Nov): Janet speaks plainly (she had picked up Edith's "love") and
  reacts when told of the fall nobody told her about; who gives the eye drops is now scripted
  (asked in every run, answered by guesswork); Edith says she does her own meals only when
  asked; observations are single findings plus an "obs" set, and lying and standing BP
  records the pulse. A symptom not in a person's script is one they do not have (as an unlisted
  exam is unremarkable), so routine negatives such as chest pain need no lines; Edith's
  giddiness passes when she sits; the key safe is scripted.

patient:
  name: Edith Marsh
  age: 84
  summary: >
    Lives alone in a two-storey terraced house. Mild Alzheimer's disease, hypertension.
    Admitted in October after a fall with a postural drop in blood pressure. Care agency
    visits twice daily; her daughter visits on Sundays.

hidden_truth:
  - id: t_furosemide
    category: medicines
    statement: >
      Furosemide is not indicated (no heart failure) and is worsening her postural
      hypotension. She takes it every morning from her dosette.
  - id: t_missed_meds
    category: medicines
    statement: >
      Morning medicines are taken with agency prompting. Evening donepezil is missed on most
      nights: the evening call comes after 9pm, when she is asleep or drowsy and declines.
      Nobody has moved the dose or the call time. She goes to bed by about 8.30pm.
  - id: t_eye_drops
    category: medicines
    statement: >
      Latanoprost is supplied separately from the blister pack. The carers give only the
      blister pack; Edith is meant to put the drops in herself at bedtime and mostly forgets.
  - id: t_postural
    category: risks
    statement: >
      Symptomatic postural hypotension: systolic drop of about 30 mmHg on standing, worse in
      the morning after her tablets.
  - id: t_falls
    category: falls
    statement: >
      Two falls in the past month: the fall that led to admission 3 weeks ago, and a fall in
      the hallway 1 week ago when the agency found her on the floor in the morning. She does
      not remember the second fall.
  - id: t_fall_2
    category: falls
    from_visit: 2
    statement: >
      A third fall at night going to the toilet, 5 days before visit 2, with a lie of about
      6 hours on the bathroom floor. Bruising only. New night-time confusion since.
  - id: t_mobility
    category: mobility
    statement: >
      Walks with a stick and furniture-walks indoors. The walking frame issued at discharge is
      folded in the hallway, unused. Slow and unsteady on turning. Manages the stairs slowly
      with the rail; her bedroom and toilet are upstairs.
  - id: t_adls
    category: adls
    statement: >
      Washes and dresses with prompting from the morning carer. Has stopped using the cooker
      and skips lunch; leaves sandwiches uneaten. Occasional urinary incontinence she hides.
      Janet does a weekly shop on Sundays.
  - id: t_cognition
    category: cognition
    statement: >
      Mild Alzheimer's disease. Poor recall of recent events, including falls. Can hold a
      conversation and presents well socially.
  - id: t_care_delivered
    category: care_delivered
    statement: >
      Two agency calls daily, running at about 15 minutes because of staffing. The evening
      call often comes after 9pm. No lunchtime call. The package no longer fits her needs.
  - id: t_carer_strain
    category: carer_strain
    statement: >
      Her daughter Janet works full time, visits only on Sundays, feels guilty and fears her
      mother will be moved to a care home. She has never had a carer's assessment.
  - id: t_alarm
    category: risks
    statement: >
      Has a pendant alarm but takes it off and misplaces it, so she cannot summon help after
      a fall. Loose rug in the hallway and poor landing lighting.
  - id: t_background
    category: other
    statement: >
      Widowed 10 years (husband Frank). Lonely and low at times, not depressed. A small sherry
      most evenings; never smoked. Osteoarthritis of the knees (paracetamol when needed),
      glaucoma (eye drops), CKD stage 3a. Wants to stay in her own home. Her neighbour Doreen
      chats over the fence but is frail herself and gives no practical help. Enjoys afternoon
      quiz shows. Worries about her eyesight.
  - id: t_bppv
    category: other
    statement: >
      Red herring: benign paroxysmal positional vertigo 6 years ago, resolved. Not the cause
      of her current dizziness, which is postural.
  - id: t_delirium
    category: risks
    from_visit: 2
    statement: >
      Probable delirium from a urinary tract infection: low-grade fever, off her food,
      muddled by day and worse at night. No head injury seen; no chest pain or
      breathlessness; alert and drinking. Needs a same-day face-to-face assessment.

