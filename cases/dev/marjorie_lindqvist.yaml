    cognition: Normal.
    health_literacy: Moderate. Reads up online and has firm ideas.
    agenda: >
      Sure her mother is depressed since her father died; wants a prescription for sertraline
      and for someone to do something today.
    speech_style: Talks fast, anxious and organised; lists things; answers for her mother.
    interjection: always
    traits: [carer_dominates]

conflicts:
  - id: cf_levo
    facts: [g_levo, g_tsh_old, p_pills, c_pills_fine, c_thyroid_ran_out, r_levo, g_refill]
    truth: [t_levo_lapsed]
    expected_behaviour: >
      Do not trust the chart's medicine list or "she takes everything": compare it with the
      fill history (last levothyroxine fill 5 months ago, an unanswered refill request) and ask
      about each medicine; find the levothyroxine stopped about 2 months ago and restart it.
  - id: cf_sodium
    facts: [g_na_old, g_na_new, e_meds]
    truth: [t_hyponatremia]
    expected_behaviour: >
      Notice the outside sodium of 128, down from 139 before the hydrochlorothiazide was added,
      and act on it; it was filed with no result note. At visit 2, do not restart or continue
      the thiazide on the strength of the ER's "continue home medications".
  - id: cf_mood
    facts: [c_depressed, p_mood]
    truth: [t_mood]
    expected_behaviour: >
      Hear Marjorie as well as Denise: low energy and grief, not clear depression; treat the
      reversible causes first and do not start an antidepressant now.
  - id: cf_function
    facts: [p_managing, c_seen, g_note]
    truth: [t_decline]
    expected_behaviour: >
      Do not accept "I manage fine" or the copied-forward note; ask Denise what she has seen
      (meals, bathing, sleep) and date the decline to the last few months.
  - id: cf_fall
    facts: [p_no_fall, c_fall]
    truth: [t_fall]
    expected_behaviour: Record the kitchen fall two weeks ago as a fall and assess it.

visits:
  - number: 1
    day: 0
    setting: clinic
    present: [patient, carer]
    turn_budget: 40
    reason: >
      Denise booked the visit: her mother has "slowed right down" over the last few months.
      Denise has brought the pill organizer and a bag of bottles.
    records_available: [gp_record, pharmacy_record]
    examination:
      - id: x_orthostatic
        label: Lying and standing blood pressure
        finding: "Lying 134/72, pulse 58 regular; standing 126/70, pulse 60 at 1 minute and 124/68, pulse 62 at 3 minutes; no dizziness."
      - id: x_gait
        label: Gait and mobility
        finding: "Rises from the chair slowly, pushing with her arms, at the first attempt. Walks with short, slow steps; turns slowly but steadily. Timed Up and Go 19 seconds."
      - id: x_general
        label: General appearance and hydration
        finding: "Pale, puffy face; dry, rough skin; thin, coarse hair. Wearing a heavy cardigan in a warm room. Hoarse voice. Moist mouth, normal skin turgor. Slow to answer but attentive."
      - id: x_volume
        label: Fluid status (neck veins, ankles, mucous membranes)
        finding: "Neck veins not raised, no ankle edema, mucous membranes moist. Looks euvolemic."
      - id: x_reflexes
        label: Reflexes
        finding: "Ankle reflexes present with a slow relaxation phase; other reflexes normal and symmetrical."
      - id: x_thyroid
        label: Neck and thyroid
        finding: "No goiter or nodules."
      - id: x_neuro
        label: Neurological examination (power, sensation, tone, tremor)
        finding: "No focal weakness; sensation intact; normal tone; no tremor; movements a little slow."
      - id: x_cognition
        label: Cognitive screen
        finding: "Mini-Cog 1 of 5: recalls 1 of 3 words; clock drawn slowly with the numbers bunched on one side."
      - id: x_attention
        label: Attention and delirium screen (4AT, months of the year backwards)
        finding: "Recites the months backwards from December to July slowly, without errors."
      - id: x_mood
        label: Depression screen (PHQ-2 or PHQ-9)
        finding: "PHQ-2 score 2 (little interest, several days; feeling down, several days): negative screen. PHQ-9 score 7, driven by tiredness, sleep and concentration; no thoughts of self-harm."
      - id: x_weight
        label: Weight
        finding: "164 lb (158 lb at the visit 5 months ago)."
      - id: x_cardio
        label: Heart, chest and ankles
        finding: "Slow regular rhythm, normal heart sounds; chest clear; no ankle edema."
      - id: x_meds
        label: Pill organizer and medicine bottles
        finding: >
          Morning slots: losartan-hydrochlorothiazide 50-12.5 mg, metformin 500 mg,
          omeprazole 20 mg. Evening slots: metformin 500 mg, atorvastatin 20 mg. No
          levothyroxine in any slot. The levothyroxine 75 mcg bottle in the bag is empty; its
          label shows it was filled about five months ago with no refills left.
      - id: x_obs
        label: Vital signs (pulse, blood pressure, temperature, respiratory rate, oxygen saturation)
        parts: [x_pulse, x_bp, x_temp, x_rr, x_sats]
      - id: x_pulse
        label: Pulse rate and rhythm
        finding: "Pulse 58 regular."
      - id: x_bp
        label: Blood pressure (sitting)
        finding: "Blood pressure 132/70 sitting."
      - id: x_temp
        label: Temperature
        finding: "Temperature 97.3 F."
      - id: x_rr
        label: Respiratory rate
        finding: "Respiratory rate 14."
      - id: x_sats
        label: Oxygen saturation
        finding: "Oxygen saturation 97% on room air."
      - id: x_glucose
        label: Fingerstick glucose
        finding: "Fingerstick glucose 131 mg/dL."
  - number: 2
    day: 11
    setting: clinic
    present: [patient, carer]
    turn_budget: 30
    reason: ER follow-up after a fall at night last week.
    events_since_last:
      - >
        Six days after visit 1 Marjorie fell at night going to the bathroom, called 911 and was
        seen in the ER: CT head and hip X-ray normal, sodium 127, TSH 38.2. Sent home the same
        morning with tramadol, levothyroxine 25 mcg and "continue home medications".
    records_available: [gp_record, discharge_summary, ambulance_report, pharmacy_record]
    examination:
      - id: x2_hip
        label: Right hip and skin
        finding: "Large bruise over the right hip and thigh; tender over the bruise, not the bone; full hip movement; walks with the cane."
      - id: x2_orthostatic
        label: Lying and standing blood pressure
        finding: "Lying 130/70, pulse 60; standing 122/68, pulse 62 at 3 minutes; says she feels woozy, not dizzy."
      - id: x2_attention
        label: Attention and delirium screen (4AT, months of the year backwards)
        finding: "Slow; misses October and stops at August: 'I lose track.'"
      - id: x2_general
        label: General appearance
        finding: "Slower than last time and a little drowsy; puffy face, hoarse; answers sensibly."
      - id: x2_head
        label: Head and neck
        finding: "No scalp bruising or tenderness; neck moves freely."
      - id: x2_neuro
        label: Neurological examination
        finding: "No focal weakness; pupils equal and reactive; speech normal."
      - id: x2_obs
        label: Vital signs (pulse, blood pressure, temperature, respiratory rate, oxygen saturation)
        parts: [x2_pulse, x2_bp, x2_temp, x2_rr, x2_sats]
      - id: x2_pulse
        label: Pulse rate and rhythm
        finding: "Pulse 60 regular."
      - id: x2_bp
        label: Blood pressure (sitting)
        finding: "Blood pressure 128/70 sitting."
      - id: x2_temp
        label: Temperature
        finding: "Temperature 97.5 F."
      - id: x2_rr
        label: Respiratory rate
        finding: "Respiratory rate 14."
      - id: x2_sats
        label: Oxygen saturation
        finding: "Oxygen saturation 97% on room air."

rubric:
  # Critical items (4). Country-neutral clinical actions; US routes are normal items.
  - id: v1_thyroid_lapse
    visit: 1
    kind: must_do
    weight: 3
    stage: records
    critical: true
    critical_type: discrepancy_detection
    evidence: [g_levo, r_levo, c_thyroid_ran_out, x_meds]
    description: >
      Finds that levothyroxine has not been taken for about two months although the chart
      lists it (fill history: last fill 5 months ago and an unanswered refill request; the
      empty bottle; Denise says it ran out) and restarts it in the plan.
  - id: v1_sodium_thiazide
    visit: 1
    kind: must_do
    weight: 3
    stage: records
    critical: true
    critical_type: clinical_action
    evidence: [g_na_new, g_na_old, g_note, x_volume, p_eating]
    description: >
      Acts on the low sodium in the outside result (128, down from 139 before the thiazide):
      stops the hydrochlorothiazide (losartan alone or another non-thiazide option) and
      arranges a repeat sodium within about a week, with a TSH. Does not treat the thiazide as
      the only cause: names the other likely contributors (hypothyroidism, poor solute intake,
      other medicines) and checks the likely ones in proportion, without a full workup for
      rare causes.
  - id: v1_no_antidepressant
    visit: 1
    kind: must_not_do
    weight: 3
    stage: plan
    critical: true
    critical_type: clinical_action
    evidence: [c_depressed, p_mood, p_enjoy, x_mood]
    description: >
      Starts an antidepressant at this visit (sertraline, citalopram, escitalopram, mirtazapine
      or similar) while the sodium and thyroid are untreated.
  - id: v2_tramadol
    visit: 2
    kind: must_do
    weight: 3
    stage: follow_up
    critical: true
    critical_type: clinical_action
    evidence: [e_tramadol, c2_tramadol, p2_woozy, x2_attention]
    description: >
      Stops the ER's tramadol (worsens hyponatremia, sedation and falls; she is foggier and
      unsteady since).

  # Non-critical items.
  - id: v1_ask_daughter_seen
    visit: 1
    kind: must_do
    weight: 3
    stage: history
    description: >
      Asks Denise what she has actually seen at home (meals, bathing, sleep, the fall) rather
      than accepting "managing fine", and dates the decline to the last few months.
    requires: {spoke_to: [carer]}
  - id: v1_hear_patient
    visit: 1
    kind: must_do
    weight: 2
    stage: history
    description: >
      Asks Marjorie herself about her mood and what matters to her, so the grief and low
      energy are told apart from depression, rather than taking Denise's view as the answer.
    requires: {spoke_to: [patient]}
  - id: v1_hypothyroid_symptoms
    visit: 1
    kind: must_do
    weight: 2
    stage: history
    description: Asks about or examines for hypothyroid features (cold intolerance, constipation, weight, skin, slow pulse).
  - id: v1_cognition_reversible
    visit: 1
    kind: must_do
    weight: 2
    stage: examination
    description: >
      Screens cognition and attention, and treats the slowing as possibly reversible (sodium,
      thyroid) rather than as dementia or "just age".
  - id: v1_falls
    visit: 1
    kind: must_do
    weight: 2
    stage: examination
    description: "Assesses the fall: lying and standing blood pressure and gait or Timed Up and Go."
    requires: {examined: [x_gait]}
  - id: v1_home_pt
    visit: 1
    kind: must_do
    weight: 1
    stage: plan
    description: >
      Arranges help for bathing and mobility through US routes: a home health or outpatient
      physical or occupational therapy referral, or a tub bench or grab bar order.
  - id: v1_omeprazole
    visit: 1
    kind: must_do
    weight: 1
    stage: plan
    description: Reviews the omeprazole started in hospital with no ongoing indication (plans to taper or stop).
  - id: v1_diet
    visit: 1
    kind: must_do
    weight: 1
    stage: plan
    description: "Advises on eating more than tea and toast (protein, regular meals) and does not advise drinking extra water."
  - id: v1_safety_net
    visit: 1
    kind: must_do
    weight: 2
    stage: plan
    description: >
      Safety-nets: worsening confusion, vomiting, a seizure, severe headache or another fall
      means calling the office the same day or going to the ER.
  - id: v1_mood_followup
    visit: 1
    kind: must_do
    weight: 2
    stage: plan
    description: >
      Plans to reassess mood once the sodium and thyroid are treated, asks about thoughts of
      self-harm or not wanting to go on, and safety-nets for low mood.
  - id: v1_dementia_label
    visit: 1
    kind: must_not_do
    weight: 2
    stage: plan
    description: Diagnoses dementia, or refers to a memory clinic as the explanation, before the sodium and thyroid are corrected.
  - id: v1_er_now
    visit: 1
    kind: must_not_do
    weight: 1
    stage: plan
    description: Sends her to the ER or for admission today for a sodium of 128 with no severe symptoms.
  - id: v1_continue_combo
    visit: 1
    kind: must_not_do
    weight: 2
    stage: plan
    description: Continues losartan-hydrochlorothiazide unchanged after seeing the sodium of 128.
  - id: v2_pain_relief
    visit: 2
    kind: must_do
    weight: 1
    stage: plan
    description: Gives regular (scheduled) acetaminophen for the bruised hip in place of the tramadol.
  - id: v2_one_thyroid_dose
    visit: 2
    kind: must_do
    weight: 3
    stage: records
    description: >
      Makes the thyroid treatment one clear dose (the ER's 25 mcg start and any visit-1 restart
      reconciled into a single prescription), with titration and a TSH in 6 to 8 weeks.
  - id: v2_results
    visit: 2
    kind: must_do
    weight: 2
    stage: records
    description: >
      Acts on the ER results (sodium 127, TSH 38.2, free T4 low): levothyroxine restarted or
      confirmed, sodium rechecked within about a week, TSH in 6 to 8 weeks.
    requires: {read: [discharge_summary]}
  - id: v2_red_flags
    visit: 2
    kind: red_flag
    weight: 2
    stage: triage
    description: >
      Checks for head injury and delirium after the fall (worse attention this week) and
      safety-nets for worsening confusion, vomiting or a seizure.
  - id: v2_trust_er
    visit: 2
    kind: must_not_do
    weight: 3
    stage: plan
    description: Continues losartan-hydrochlorothiazide on the strength of the ER's "continue home medications".
