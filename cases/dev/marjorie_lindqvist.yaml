# Development case built on an open case report (CC BY; provenance and changes in
# sources/provenance/marjorie_lindqvist.yaml, never shown to a model). Fictional: every
# person, place and institution is invented. Development only: never counted in the pilot.
# Drafted by the agent for the clinical lead to check, correct and add primary care detail to.
id: marjorie_lindqvist
title: Marjorie Lindqvist - slowing down, a thyroid refill that ran out and a daughter who thinks it is grief
country: us
messiness: moderate
notes: >
  Reversible decline from chronic hyponatremia (hydrochlorothiazide added 5 months ago, low
  solute intake) and untreated hypothyroidism (the levothyroxine refill lapsed about 2 months
  ago; the chart still lists it). The low sodium is already in the chart as an outside result
  nobody acted on. The daughter wants an antidepressant, which would make the sodium worse.
  Visit 2 follows an ER visit for a night-time fall: the ER says "continue home medications"
  (including the thiazide), started levothyroxine 25 mcg and added tramadol. New information,
  not a plan that was ignored (changed 5 Nov after the clinical lead's review).

patient:
  name: Marjorie Lindqvist
  age: 84
  summary: >
    Widowed, lives alone in a one-storey house. Hypertension, type 2 diabetes, hypothyroidism,
    osteoarthritis of the knees. Her daughter fills a weekly pill organizer and does her
    groceries.

hidden_truth:
  - id: t_hyponatremia
    category: risks
    statement: >
      Chronic euvolemic hyponatremia: sodium 139 seven months ago, 128 five weeks ago (urgent
      care, never acted on), about 126 now. Causes: hydrochlorothiazide (losartan 50 mg was
      changed to losartan-hydrochlorothiazide 50-12.5 mg five months ago with no follow-up
      electrolytes), untreated hypothyroidism and a tea-and-toast diet. It explains much of
      her slowing, unsteadiness and poor concentration. No vomiting, seizures or severe
      confusion: not an emergency at visit 1.
  - id: t_levo_lapsed
    category: medicines
    statement: >
      Hypothyroidism since 2014 on levothyroxine 75 micrograms, stable (TSH 2.1 fourteen months
      ago). The last fill was 5 months ago with no refills left; the pharmacy's refill request
      two months ago was never answered. The bottle ran out about 2 months ago and her daughter
      assumed the doctor had stopped it, so it is not in the organizer. TSH is now high.
  - id: t_hypothyroid_symptoms
    category: other
    statement: >
      Feels cold all the time, dry skin, thinning hair, hoarse voice, constipation, weight up
      6 lb in 5 months despite eating little, slow pulse.
  - id: t_decline
    category: adls
    statement: >
      Over about 4 months: tired, naps every afternoon, slower in everything. Has stopped
      cooking (toast, crackers, cereal, tea, canned soup). Needs her daughter's help in and out
      of the tub twice a week; still dresses herself slowly; continent. Stopped going to her
      Tuesday bridge group. Walks slowly, uses her late husband's cane in the house since the
      fall.
  - id: t_fall
    category: falls
    statement: >
      One fall two weeks before visit 1: legs gave way in the kitchen, slid down holding the
      counter, no injury, got herself up using a chair and phoned her daughter. Nobody else
      was told.
  - id: t_cognition
    category: cognition
    statement: >
      Slowed thinking, poor concentration and recall for recent things, from the hyponatremia
      and hypothyroidism; likely reversible. Not delirious at visit 1 (attention intact).
      Sharp a year ago.
  - id: t_mood
    category: other
    statement: >
      Grieving her husband Walt (died 18 months ago) but not depressed: low energy rather than
      low mood, still enjoys her grandchildren's Sunday visits and her TV programs. Her
      daughter is sure it is depression and wants her started on sertraline; an SSRI would
      worsen the hyponatremia.
  - id: t_background
    category: other
    statement: >
      Hypertension for 20 years; type 2 diabetes for 8 years on metformin (HbA1c 6.6% seven
      months ago); osteoarthritis of both knees (acetaminophen when needed); mild hearing loss.
      Omeprazole was started during a pneumonia admission 18 months ago and never reviewed; no
      reflux symptoms. Never smoked; no alcohol beyond a glass of wine at Christmas. Stopped
      driving a year ago. One-storey house with one step at the back door. Wants to stay in
      her own home.
  - id: t_carer
    category: carer_strain
    statement: >
      Daughter Denise works part time, stops by most days after work, does the groceries and
      fills the pill organizer every Sunday from the bottles. Anxious, stretched between her
      mother and her own family, frightened her mother is "giving up".
  - id: t_fall_2
    category: falls
    from_visit: 2
    statement: >
      Fall in the night 6 days after visit 1 getting up to the bathroom; could not get up,
      crawled to the phone and called 911. ER: CT head normal, no hip fracture, bruised right
      hip; sodium 127, TSH 38.2, free T4 low. Sent home the same morning.
  - id: t_tramadol
    category: medicines
    from_visit: 2
    statement: >
      The ER prescribed tramadol 50 mg every 6 hours as needed for the hip bruise. She takes
      two or three a day and has been foggier and more unsteady since. Tramadol worsens
      hyponatremia, sedation and falls risk; scheduled acetaminophen would do.
  - id: t_er_levo
    category: medicines
    from_visit: 2
    statement: >
      The ER started levothyroxine 25 micrograms daily ("PCP to titrate") without knowing what
      was planned at visit 1, so she may now have two thyroid prescriptions with different
      doses. She needs one clear dose (restarting low and titrating every 6 to 8 weeks is
      fine at 84) and a TSH in 6 to 8 weeks.

