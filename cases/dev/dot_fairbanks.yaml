# Development case, negative-workup, built on an open case report (CC BY; provenance in
# sources/provenance/dot_fairbanks.yaml, never shown to a model) from the skeleton
# cases/skeletons/anaemia-clear-scopes.md as revised with the clinical lead on 5 Nov. UK case: marked
# against UK guidance (BSG/ACPGBI 2025: FIT and coeliac serology in primary care before
# referral). Fictional throughout. Development only.
id: dot_fairbanks
title: Dot Fairbanks - iron-deficient, the bowel tests are clear, and "she only takes what the doctor gives her"
country: uk
messiness: moderate
notes: >
  Iron-deficiency anaemia in an 82-year-old whose causes are common and outside the bowel's
  reach: a tea-and-toast diet since her knees stopped her cooking, over-the-counter ibuprofen
  her husband buys (on no record), aspirin still dispensed on top of apixaban, and iron tablets
  she stopped. Visit 1: screen the bowel and upper-GI cancer symptoms and start the UK workup
  (FIT and coeliac serology, referral by the result). Visit 2: FIT negative, coeliac negative
  (scopes clear if requested), Hb barely moved: act on the common causes with a recheck, no
  "all clear, stop the iron", no reflex capsule or CT. Visit 3 (phone): Hb rising; reassure,
  continue iron with a recheck, no more tests. Built 5 Nov.

patient:
  name: Dorothy Fairbanks
  age: 82
  summary: >
    Married, lives with her husband Frank in a terraced house. Atrial fibrillation on
    apixaban, a TIA in the past, osteoarthritis of both knees, hypertension.

hidden_truth:
  - id: t_ida
    category: risks
    statement: >
      Iron-deficiency anaemia from three common causes together: a poor diet for about 9
      months (little meat or iron-rich food), slow blood loss from the stomach caused by
      ibuprofen on top of apixaban and aspirin (small antral erosions, no ulcer), and iron
      tablets she stopped after a week. No cancer, no coeliac disease. Hb 121 g/L eight months
      before visit 1, 94 g/L at visit 1, 96 at visit 2, 109 by visit 3 as she restarts iron and
      eats better.
  - id: t_diet
    category: adls
    statement: >
      Since her knees got worse she cannot stand long enough to cook. She lives on tea and
      toast, cereal, soup and biscuits; meat about once a week. Frank cannot cook.
  - id: t_nsaid
    category: medicines
    statement: >
      Takes ibuprofen 200 mg, two tablets most days, for her knees. Frank buys several packs
      of Nurofen at the supermarket each week. It is on no record. Paracetamol never helped
      her, she says, because she only took one at a time.
  - id: t_antithrombotics
    category: medicines
    statement: >
      Apixaban 5 mg twice daily (cardiology, 14 months ago, for atrial fibrillation; weight 66
      kg, creatinine normal, so the full dose is right). Cardiology's letter said to stop
      aspirin when apixaban started, but the GP repeat list was never updated and the pharmacy
      still puts aspirin 75 mg in her weekly blister pack.
  - id: t_iron
    category: medicines
    statement: >
      The GP started ferrous sulfate 200 mg daily three weeks ago on a routine blood result. She
      stopped after a week because it constipated her ("bunged me up"). She has not told
      anyone.
  - id: t_no_cancer
    category: risks
    statement: >
      No bowel cancer, no stomach cancer. No change in bowel habit, no rectal bleeding, no black
      stools, no weight loss, no trouble swallowing, no vomiting, no abdominal mass. Some
      heartburn after meals for 2 months (from the ibuprofen). FIT 6 µg Hb/g. If scoped: a few
      small antral erosions, H. pylori negative; colonoscopy shows diverticulosis only.
  - id: t_function
    category: mobility
    statement: >
      Walks with a stick, slowly because of her knees. Washes and dresses herself. Breathless
      on the stairs over the last 3 months. Frank does the shopping and the pill box.
  - id: t_background
    category: other
    statement: >
      Retired school secretary. Married to Frank 60 years. Her sister died of bowel cancer at
      70. Never smoked; a sherry at Christmas. A granddaughter, Emma, lives nearby.
  - id: t_v2
    category: risks
    from_visit: 2
    statement: >
      Day 35: still tired. FIT and coeliac serology negative (scopes clear if requested). Hb 96,
      barely changed: she is still not taking iron, still on ibuprofen and aspirin, still eating
      poorly.
  - id: t_v3
    category: risks
    from_visit: 3
    statement: >
      Day 63: Hb 109 and ferritin 24 on the practice nurse's recheck, and she feels better.
      She restarted iron on alternate days after the pharmacist suggested it and Emma brings
      meals twice a week. Her knees ache and Frank thinks the Nurofen is fine. She is
      responding to treatment: no more tests are needed now.

