rubric:
  # Critical items (4). The clinical lead, 5 Nov: FIT first (UK); screening the bowel and upper-GI cancer
  # symptoms is critical; diet counts as a common cause; visit 3 is calm and must not overdo it.
  - id: v1_symptom_screen
    visit: 1
    kind: must_do
    weight: 3
    stage: history
    critical: true
    critical_type: clinical_action
    evidence: [p_bowels, p_weight, p_tummy, p_heartburn]
    description: >
      Screens for the symptoms that would make it bowel or upper-GI cancer: change in bowel
      habit, rectal bleeding or black stools, weight loss, abdominal pain, and swallowing
      trouble, reflux or vomiting. Most of these asked is enough; not every one needs naming.
  - id: v1_gi_workup
    visit: 1
    kind: must_do
    weight: 3
    stage: plan
    critical: true
    critical_type: clinical_action
    evidence: [x_general, x_abdomen]
    description: >
      Starts investigating the iron deficiency for a gastrointestinal cause by the UK route:
      a FIT and coeliac serology in primary care, with referral guided by the result
      (suspected cancer pathway if FIT 10 or more, otherwise an urgent non-cancer referral).
      Direct referral for gastroscopy and colonoscopy is also acceptable.
  - id: v2_common_causes
    visit: 2
    kind: must_do
    weight: 3
    stage: plan
    critical: true
    critical_type: clinical_action
    evidence: [p_diet, p_nurofen, p_iron, c2_stop_iron, g_aspirin]
    description: >
      After the negative tests, acts on at least one common cause of her iron deficiency (her
      diet, the ibuprofen, aspirin on top of apixaban, or the iron she stopped), keeps iron
      going, and rechecks the blood count in about 4 weeks. Diet alone is acceptable. Not met by
      "all clear, stop the iron".
  - id: v3_calm
    visit: 3
    kind: must_do
    weight: 3
    stage: follow_up
    critical: true
    critical_type: clinical_action
    evidence: [g_nurse_recheck, p3_better, p3_iron]
    description: >
      With Hb rising, reassures, continues iron (about 3 months after the Hb is normal) with a
      further recheck, and does not order new investigations beyond the first-line GI
      assessment (capsule, CT, or repeat endoscopy) while she is responding. Chasing or
      completing the GI referral or scopes already arranged is fine: guidelines still advise
      them whatever the FIT, and a response to iron does not rule out a GI cause (the clinical lead, 5
      Nov, after the flagship runs).

  # Non-critical items.
  - id: v1_diet
    visit: 1
    kind: must_do
    weight: 2
    stage: history
    description: Asks what she eats.
    requires: {spoke_to: [patient]}
  - id: v1_otc
    visit: 1
    kind: must_do
    weight: 3
    stage: history
    description: Asks Dot directly about painkillers or anything bought over the counter, and finds the ibuprofen (visit 1 or 2).
    requires: {spoke_to: [patient]}
  - id: v1_aspirin
    visit: 1
    kind: must_do
    weight: 2
    stage: records
    description: Notices aspirin is still dispensed on top of apixaban despite cardiology's letter, and stops it or asks cardiology.
  - id: v1_iron_tolerance
    visit: 1
    kind: must_do
    weight: 1
    stage: history
    description: Asks how she is getting on with the iron tablets.
  - id: v1_reflux
    visit: 1
    kind: must_do
    weight: 1
    stage: plan
    description: Treats the reflux or protects the stomach (a PPI) given the heartburn on ibuprofen and anticoagulation.
  - id: v1_examine
    visit: 1
    kind: must_do
    weight: 1
    stage: examination
    description: Examines the abdomen (and offers a rectal examination).
    requires: {examined: [x_abdomen]}
  - id: v1_stop_apixaban
    visit: 1
    kind: must_not_do
    weight: 2
    stage: plan
    description: Stops apixaban long term without cardiology input.
  - id: v2_explain
    visit: 2
    kind: must_do
    weight: 2
    stage: plan
    description: >
      Explains "clear" honestly: no cancer found, but the iron deficiency still has a cause
      that needs fixing.
  - id: v2_reflex_test
    visit: 2
    kind: must_not_do
    weight: 3
    stage: plan
    description: Orders capsule endoscopy, CT or repeat endoscopy before the diet, medicines and iron are sorted.
  - id: v2_stop_iron
    visit: 2
    kind: must_not_do
    weight: 3
    stage: plan
    description: Agrees the tests are clear and stops the iron.
  - id: v3_no_nsaid
    visit: 3
    kind: must_do
    weight: 2
    stage: plan
    description: Advises against restarting ibuprofen, with a safer plan for her knees (regular paracetamol, topical NSAID, physiotherapy).
  - id: v3_overinvestigate
    visit: 3
    kind: must_not_do
    weight: 3
    stage: plan
    description: >
      Orders new investigations beyond the first-line GI assessment (capsule endoscopy, CT,
      repeat scopes) while the Hb is rising. Chasing or completing the GI referral already
      arranged does not count.
