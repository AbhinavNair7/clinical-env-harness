        finding: "CA 19-9 690 U/mL (high)."
      - id: r2_ct
        label: Cross-sectional imaging of the abdomen or pancreas (CT with contrast, pancreas-protocol CT, MRI or MRCP, or endoscopic ultrasound)
        finding: "3.1 cm mass in the pancreatic body encasing the splenic vein. Two liver lesions (1.2 and 0.8 cm) suspicious for metastases. Mild intrahepatic bile duct dilation."
      - id: r2_us
        label: Ultrasound abdomen
        finding: "Two liver lesions. Mild intrahepatic bile duct dilation. Pancreas partly obscured by bowel gas."
