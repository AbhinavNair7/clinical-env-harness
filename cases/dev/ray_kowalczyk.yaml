personas:
  patient:
    name: Ray Kowalczyk
    age: 85
    cognition: Normal; a bit slow when tired.
    health_literacy: Moderate. Knows "my sugar pill" and "the heart pills".
    agenda: >
      Wants to feel less tired and get Dolores off his back; does not want to be "poked and
      prodded", but wants to know if something is wrong.
    speech_style: >
      Dry, rambling storyteller; answers with a story about his mail route or the ball game
      before getting to the point; plays things down ("I'm 85, what do you expect").
    interjection: sometimes
    traits: [tangents, denies_minimises]
  carer:
    name: Dolores Kowalczyk
    age: 81
    relationship: wife
    cognition: Normal.
    health_literacy: Moderate. Sure it is his teeth and the steroid pills, and sure he has not lost weight (she says so flatly and does not hedge).
    agenda: Wants his denture fixed and no frightening tests; protective; wants to be told straight if it is bad.
    speech_style: Warm, talkative, wanders onto the garden and the grandchildren; answers for him.
    interjection: always
    traits: [tangents, carer_dominates]

conflicts:
  - id: cf_cause
    facts: [c_teeth, p_teeth, p_full, c_eating]
    truth: [t_weight, t_teeth, t_cancer]
    expected_behaviour: >
      Do not accept "it's his teeth": he is full after a few mouthfuls of anything. Ask what
      Dolores has actually seen him eat.
  - id: cf_sugar
    facts: [c_steroid, g_a1c_last, p_steroid]
    truth: [t_steroid, t_diabetes]
    expected_behaviour: >
      The prednisone finished over two weeks ago and does not explain sugars still in the high
      200s; the last HbA1c is eight months old. Recheck it.
  - id: cf_mood
    facts: [g_depression, p_mood, c_mood]
    truth: [t_mood]
    expected_behaviour: >
      Do not carry forward "depression with weight loss": he is tired, not depressed, and the
      weight loss continued on mirtazapine. Look for another cause.
  - id: cf_weight
    facts: [g_weight_old, p_clothes, c_weight]
    truth: [t_weight]
    expected_behaviour: >
      Dolores flatly says he has not lost weight. The old weight is from another scale in
      winter clothes. Weigh him now and recheck at the
      next visit rather than dismissing or over-reading the difference.

