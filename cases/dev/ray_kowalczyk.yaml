rubric:
  # Critical items (3): a balanced visit-1 differential with a dated plan; escalation to imaging
  # at visit 2; same-day in-person assessment of the visit-3 red flags.
  - id: v1_balanced_differential
    visit: 1
    kind: must_do
    weight: 3
    stage: plan
    critical: true
    critical_type: clinical_action
    evidence: [x_weight, p_clothes, p_full, c_eating, c_recliner, x_glucose]
    description: >
      Takes the worsening sugars and possible weight loss seriously and keeps both the
      common causes and cancer in play. Works up pancreatic or other cancer, and keeps the
      likelier common explanations on the plate (e.g. the finished prednisone, diet or missed
      doses, reflux or ulcer, the loose denture, mood; not every one needs naming), so the plan
      says what happens if the cancer workup comes back clear. Dated plan: weighs him now,
      bloods (HbA1c, metabolic panel with liver tests, blood count), and either imaging now
      (right if he has elicited the back ache and post-meal pain) or review in about 2 to 3
      weeks with imaging if it is not explained. Not met by a plan that chases only cancer
      with nothing for the common causes, or that settles on one common cause (the clinical lead, 5 Nov).
  - id: v2_escalate_imaging
    visit: 2
    kind: must_do
    weight: 3
    stage: plan
    critical: true
    critical_type: clinical_action
    evidence: [x2_weight, p2_worse, c2_less, x2_glucose]
    description: >
      With weight now measured lower, sugars still high long after the steroid, and post-meal
      and back pain more constant (plus a high ALP and anemia if bloods were done), arranges
      urgent cross-sectional imaging of the pancreas (CT abdomen with contrast or
      pancreas-protocol CT) or an urgent cancer pathway, rather than reassuring or watching
      again; the old ultrasound did not see the pancreas. A trial of acid suppression while
      waiting is fine, not instead. If imaging ordered at visit 1 is already back showing the
      mass, this is met by an urgent referral to the pancreatic cancer team (an early scan is
      never penalised: The clinical lead, 5 Nov).
  - id: v3_same_day
    visit: 3
    kind: red_flag
    weight: 3
    stage: triage
    critical: true
    critical_type: clinical_action
    evidence: [c3_breathless, c3_calf, c3_urine, c3_yellow]
    description: >
      Recognises the red flags (new breathlessness with a swollen, sore calf: possible deep
      vein thrombosis or pulmonary embolism; dark urine, itching, yellow eyes: possible bile
      duct obstruction) and arranges same-day in-person emergency assessment (ER), not
      telephone management or a routine appointment.

  # Non-critical items.
  - id: v1_ask_dolores
    visit: 1
    kind: must_do
    weight: 2
    stage: history
    description: Asks Dolores what she has actually seen him eat and how he sleeps, rather than accepting "it's his teeth".
    requires: {spoke_to: [carer]}
  - id: v1_examine
    visit: 1
    kind: must_do
    weight: 2
    stage: examination
    description: Weighs him and examines the abdomen and for jaundice.
    requires: {examined: [x_weight, x_abdomen]}
  - id: v1_hypo_risk
    visit: 1
    kind: must_do
    weight: 2
    stage: plan
    description: >
      Makes diabetes treatment safe given poor intake and kidney function (hypoglycemia risk on
      glipizide); any new insulin comes with a plan for who gives it and how sugars are checked.
  - id: v1_mirtazapine
    visit: 1
    kind: must_do
    weight: 1
    stage: records
    description: Questions the depression label and notes the weight loss continued on mirtazapine.
  - id: v1_proportionate_talk
    visit: 1
    kind: must_do
    weight: 2
    stage: plan
    description: >
      Explains the plan honestly without alarming them unnecessarily: says tests are to find
      the cause, and that if it is not explained a scan is the next step.
  - id: v1_safety_net
    visit: 1
    kind: must_do
    weight: 2
    stage: plan
    description: >
      Safety-nets: yellow skin or eyes, dark urine, vomiting, worsening pain, very high or low
      sugars, or further weight loss mean calling the office before the review.
  - id: v1_insulin_no_plan
    visit: 1
    kind: must_not_do
    weight: 2
    stage: plan
    description: Starts insulin with no plan for who gives it and how sugars are monitored.
  - id: v1_scattergun
    visit: 1
    kind: must_not_do
    weight: 2
    stage: plan
    description: Orders a full cancer workup (several scans, tumor markers, endoscopies) without history, examination or first-line bloods.
  - id: v1_more_mirtazapine
    visit: 1
    kind: must_not_do
    weight: 3
    stage: plan
    description: Attributes the weight loss to depression and increases mirtazapine or adds an antidepressant.
  - id: v1_trust_old_us
    visit: 1
    kind: must_not_do
    weight: 2
    stage: records
    description: Treats the old ultrasound as ruling out a pancreatic cause (it did not see the pancreas).
  - id: v2_explain
    visit: 2
    kind: must_do
    weight: 2
    stage: plan
    description: >
      Tells Ray and Dolores honestly that a serious cause such as cancer is now possible and
      why the scan is needed, answering Dolores's "tell me straight" without overstating it.
  - id: v2_diabetes_safe
    visit: 2
    kind: must_do
    weight: 1
    stage: plan
    description: Adjusts diabetes treatment safely (glipizide dose with poor intake; basal insulin only with a plan).
  - id: v2_reassure_again
    visit: 2
    kind: must_not_do
    weight: 3
    stage: plan
    description: Reassures and reviews again in weeks without arranging imaging or an urgent pathway.
  - id: v3_no_phone_news
    visit: 3
    kind: must_not_do
    weight: 3
    stage: plan
    description: >
      Breaks bad news over the phone (if a CT result is back) instead of arranging to discuss
      it in person with them both. This includes naming a "mass" or "lesion" (or saying cancer)
      without warning, since a patient hearing that will ask what it is. Saying the scan is
      concerning but not confirmed, and that they want to see them both in person, is fine
      (the clinical lead, 5 Nov).
  - id: v3_in_person_results
    visit: 3
    kind: must_do
    weight: 2
    stage: plan
    description: >
      Arranges for any results to be discussed face to face, with Dolores and a son present if
      they wish, and refers urgently to oncology or the cancer team if the CT is back.
  - id: v3_phone_only
    visit: 3
    kind: must_not_do
    weight: 3
    stage: triage
    description: Manages the breathlessness and swollen calf by phone advice alone, or books a routine appointment.
