# Development case, ambiguity-first, built on an open case report (CC BY; provenance in
# sources/provenance/ray_kowalczyk.yaml, never shown to a model) with the clinical lead's lines from
# cases/skeletons/weight-loss-sugars.md. Fictional throughout. Development only.
id: ray_kowalczyk
title: Ray Kowalczyk - sugars climbing, clothes looser, and plenty of easy explanations
country: us
messiness: moderate
notes: >
  Pancreatic cancer behind worsening diabetes over three visits. Visit 1 is genuinely
  ambiguous: no home sugar log, no reliable weight, a recent steroid course, a loose denture, a
  depression label, and an old ultrasound that "could not see the pancreas". Back ache and
  post-meal pain are there only if asked. Requested tests come back by the next visit (a CT at
  visit 1 already shows the mass). Visit 2: weight measured lower, pain clearer; imaging is
  now due. Visit 3 is a phone call reception booked: dark urine, itching, breathlessness and a
  swollen calf need a same-day in-person or ER assessment, and a CT result (if ordered) must
  not be broken over the phone. Built 5 Nov from the clinical lead's skeleton lines.

patient:
  name: Ray Kowalczyk
  age: 85
  summary: >
    Married, lives with his wife Dolores in a one-storey house. Type 2 diabetes, chronic kidney
    disease stage 3a, hypertension, gout, coronary bypass surgery in 2011.

hidden_truth:
  - id: t_cancer
    category: risks
    statement: >
      Adenocarcinoma of the pancreatic body, causing his diabetes to worsen over about four
      months, weight loss of about 10 lb in six months, early fullness and a dull ache after
      meals, and a dull mid-back ache worse lying flat (he has been sleeping in his recliner).
      A contrast CT at visit 1 would show a 2.8 cm pancreatic body mass with no liver spread.
      By visit 3 there are liver lesions and the bile duct is starting to obstruct.
  - id: t_steroid
    category: medicines
    statement: >
      Prednisone 40 mg daily for 5 days for a gout flare, finished 16 days before visit 1. It
      raised his sugars for a while but does not explain sugars still in the high 200s now.
  - id: t_diabetes
    category: other
    statement: >
      Diabetes for 15 years, on glipizide 10 mg twice daily since metformin was stopped for his
      kidney function. Control has gone up and down (HbA1c 7.0 to 8.1% over three years; 7.3%
      eight months ago). HbA1c now 9.6%. He does not check sugars at home. With poor intake,
      glipizide carries a hypoglycaemia risk.
  - id: t_weight
    category: other
    statement: >
      About 10 lb lost in six months. There are no home scales. The last chart weight (172 lb)
      was nine months ago, in winter clothes, at a different clinic. 164 lb at visit 1, 161 lb
      at visit 2.
  - id: t_mood
    category: other
    statement: >
      Not depressed: tired and flat since his brother died last year, but still enjoys his
      grandchildren and the ball game. A previous PCP labelled "depression, mild" six months
      ago and started mirtazapine 15 mg for appetite and sleep; his appetite has not improved.
  - id: t_teeth
    category: other
    statement: >
      His lower denture is loose and makes steak hard to chew, which Dolores blames for him
      eating less. It is real but minor: he is full after a few mouthfuls of anything.
  - id: t_function
    category: adls
    statement: >
      Independent in self-care; drives short distances; Dolores cooks and fills his weekly pill
      box. He has stopped his morning walk to the mailbox because he is tired.
  - id: t_background
    category: other
    statement: >
      Retired mail carrier. Married 58 years. Two sons nearby. Never smoked; a beer at
      weekends. Gout in the big toes. No family history of cancer he knows of. Wants to stay
      at home and "not be poked and prodded".
  - id: t_v2
    category: risks
    from_visit: 2
    statement: >
      Day 18: still tired, eating less, the ache after meals and the back ache are more
      constant, no vomiting, no jaundice yet, stools normal colour. Office fingerstick 268.
  - id: t_v3
    category: risks
    from_visit: 3
    statement: >
      Day 33: for a week, dark urine and itching (early biliary obstruction); for three days,
      breathless walking to the bathroom, and his left calf is swollen and sore (deep vein
      thrombosis with possible pulmonary embolism). He needs same-day in-person emergency
      assessment. Any cancer result should be discussed face to face, not over the phone.

