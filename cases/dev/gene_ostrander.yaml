# Development case, ambiguity-first, built on an open case report (CC BY; provenance in
# sources/provenance/gene_ostrander.yaml, never shown to a model), the clinical lead's lines from
# cases/skeletons/falls-blamed-on-age.md and a fictionalised blend of a patient pattern from
# his clinical experience. Fictional throughout. Development only.
id: gene_ostrander
title: Gene Ostrander - "mechanical falls", a bladder pill and a memory label nobody joined up
country: us
messiness: high
notes: >
  Normal pressure hydrocephalus behind gait, bladder and thinking changes that three services
  labelled separately: "mechanical falls", "overactive bladder" (oxybutynin, a cascade on top
  of donepezil) and "probable Alzheimer's" (never imaged). His prostate cancer 15 years ago
  muddies the bladder story and puts spinal metastases in the differential. No head injury:
  last week's fall had paramedics, a normal ECG and "mechanical fall". Visit 1 fits medicines,
  ECG, falls and PT work; visit 2 is where a neurological cause must be considered and imaged
  once the basic workup is negative; visit 3 brings a third fall and, if imaging was ordered,
  the result, plus Carol's breakdown, which she only tells if asked. Built 5 Nov from
  The clinical lead's skeleton lines.

patient:
  name: Gene Ostrander
  age: 80
  summary: >
    Married, lives with his wife Carol in a two-storey house. Probable Alzheimer's disease
    (memory clinic), overactive bladder, prostate cancer treated 15 years ago, hypertension,
    an old TIA, osteoarthritis of the knees.

hidden_truth:
  - id: t_nph
    category: risks
    statement: >
      Normal pressure hydrocephalus. Over about 18 months: a slow, wide-based gait with short
      steps, feet that seem stuck to the floor on starting and turning, falls; urgency and wet
      episodes, worse over a year; slowed thinking, poor attention and apathy more than memory
      loss. His gait never recovered after a fall in last summer's heat. A CT or MRI head would
      show ventricles enlarged out of proportion to atrophy (Evans index 0.36), crowded sulci at
      the vertex, no subdural and no mass. Treatable: neurosurgery assessment with a tap test.
  - id: t_meds
    category: medicines
    statement: >
      Donepezil 10 mg (memory clinic, 2 years) is slowing his pulse to about 52 with a long PR
      interval and can add urinary urgency. Urology added oxybutynin 5 mg twice daily 8 months
      ago for urgency: an anticholinergic that worsens his thinking and constipation and
      barely helps the bladder. Aspirin 81 mg for the old TIA.
  - id: t_prostate
    category: other
    statement: >
      Radical prostatectomy for prostate cancer 15 years ago, PSA undetectable since; leakage
      after surgery settled over a year but was never perfect. The worsening over the last year
      is from the hydrocephalus, not the prostate. No back pain, no leg weakness or numbness, no
      saddle symptoms: spinal metastases are a fair differential to exclude, not the answer.
  - id: t_falls
    category: falls
    statement: >
      Three falls this year: in March tripping on the porch step; in July in the heat (two days
      in hospital, "dehydration and mechanical fall"), after which his walking never got back
      to normal; and 9 days before visit 1 stepping off the back step (paramedics: no head
      injury, ECG sinus rhythm 58, "mechanical fall", not taken to hospital). No loss of
      consciousness, no dizziness before the falls.
  - id: t_cognition
    category: cognition
    statement: >
      Memory clinic 2 years ago: MoCA 21, "probable Alzheimer's disease", no imaging (he
      declined MRI for claustrophobia; CT was never offered). Now slower and more apathetic;
      attention and planning are worse than memory; worse since the oxybutynin.
  - id: t_function
    category: adls
    statement: >
      Uses a cane outdoors. Needs Carol to stand by in the shower. Stopped driving in the
      summer. Gets up two or three times a night to pass urine, sometimes not in time.
  - id: t_carer
    category: carer_strain
    statement: >
      Carol, 76, does everything: pills, meals, washing his sheets most nights. She has moved
      to the spare room to get some sleep and is ashamed of how often he is wet, so she plays
      it down. By visit 3 she is at breaking point and has thought about a nursing home but
      has not said so. She needs to be asked how she is coping.
  - id: t_mood
    category: other
    statement: >
      Apathetic rather than depressed; still enjoys his woodworking magazines and his
      granddaughter's visits.
  - id: t_orthostatic
    category: risks
    statement: >
      No postural blood pressure drop. The falls are from the gait disorder, not blackouts.
  - id: t_background
    category: other
    statement: >
      Retired high-school shop teacher. Married 54 years. A daughter two hours away. Never
      smoked; a glass of wine with dinner now and then. Wants to stay at home with Carol.
  - id: t_v2
    category: falls
    from_visit: 2
    statement: >
      Day 21: walking the same, still up at night and wet most nights, thinking about the same
      (any medicine change has not changed the gait). No new falls. Carol is more tired.
  - id: t_v3
    category: falls
    from_visit: 3
    statement: >
      Day 46: fell in the bathroom at night 3 days ago reaching for the toilet; Carol could not
      lift him and called their neighbor. Bruised left hip, no head injury. Carol is at breaking
      point and has started looking at nursing homes.

