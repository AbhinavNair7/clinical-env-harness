personas:
  patient:
    name: Gene Ostrander
    age: 80
    cognition: Slowed; poor attention and planning more than memory; follows a conversation slowly.
    health_literacy: Moderate. Calls his pills "the memory one" and "the bladder pill".
    agenda: Wants to stay home with Carol and not be fussed over; a bit embarrassed by the bladder.
    speech_style: Slow, gentle, self-deprecating jokes; long pauses; answers briefly.
    interjection: sometimes
    traits: [denies_minimises, poor_recall]
  carer:
    name: Carol Ostrander
    age: 76
    relationship: wife
    cognition: Normal.
    health_literacy: Moderate. Trusts the memory clinic's label, and is certain his head was scanned there (says so flatly and does not hedge).
    agenda: >
      Wants him on "something stronger" for the Alzheimer's; protective of his dignity, so
      plays down the wetting; will not admit she is not coping unless asked directly.
    speech_style: Brisk, practical, a little tense; answers for him; changes the subject when embarrassed.
    interjection: always
    traits: [carer_dominates, denies_minimises]

conflicts:
  - id: cf_falls
    facts: [p_clumsy, g_mechanical, d_summer, c_walk, p_feet_stuck, m_fall]
    truth: [t_falls, t_nph]
    expected_behaviour: >
      Do not accept "mechanical falls" or "clumsy": watch him walk and ask how the walking has
      changed. A gait that never recovered after the summer, with stuck feet and shuffling, is
      a gait disorder to explain.
  - id: cf_bladder
    facts: [p_bladder_fine, c_wet, c_wet_truth, g_urology]
    truth: [t_prostate, t_function, t_meds]
    expected_behaviour: >
      The bladder is getting worse, not "the old prostate trouble": ask Carol directly how
      often he is wet at night. Oxybutynin is not helping and is adding to the confusion.
  - id: cf_memory
    facts: [c_alzheimers, c_scan, g_memory_letter, p_memory, c_slower]
    truth: [t_cognition]
    expected_behaviour: >
      Carol firmly says his head was scanned there; the clinic letter says he declined the MRI,
      so the Alzheimer's label was never imaged. Check the letter, not her word. Slowing and apathy alongside gait and bladder
      change need a fresh look, not "something stronger".
  - id: cf_carer
    facts: [c_coping, c3_breaking]
    truth: [t_carer]
    expected_behaviour: Ask Carol how she is coping, in her own right, and act on the answer.

