rubric:
  # Critical items (4): medicines and ECG (visit 1), brain imaging when the basic workup is
  # negative (visit 2), the NPH referral or imaging now (visit 3), and Carol's breakdown (visit
  # 3, only if elicited). The clinical lead 5 Nov: CT at visit 1 is not expected without a head injury.
  - id: v1_meds_ecg
    visit: 1
    kind: must_do
    weight: 3
    stage: records
    critical: true
    critical_type: clinical_action
    evidence: [x_pulse, x_orthostatic, p_constipation, c_pills]
    description: >
      Reviews the medicines against the falls and confusion: stops (or plans to taper)
      oxybutynin, an anticholinergic added on top of donepezil, and acts on the slow pulse on
      donepezil (ECG, and a donepezil review).
  - id: v2_brain_imaging
    visit: 2
    kind: must_do
    weight: 3
    stage: plan
    critical: true
    critical_type: clinical_action
    evidence: [x2_gait, c2_same, c_walk, p_feet_stuck]
    description: >
      With the gait, bladder and thinking no better after the medicine and falls work, and no
      postural drop or blackouts, considers a neurological cause (normal pressure
      hydrocephalus from the triad; also Parkinsonism, a subdural or a spinal cause) and
      arranges brain imaging (CT head or MRI), rather than putting it down to worsening
      Alzheimer's or mechanical falls. If imaging ordered at visit 1 is already back (enlarged
      ventricles), this is met by acting on it: an urgent neurology or neurosurgery referral
      for normal pressure hydrocephalus (an early scan is slightly much but never penalised:
      The clinical lead, 5 Nov).
  - id: v3_rethink_refer
    visit: 3
    kind: must_do
    weight: 3
    stage: follow_up
    critical: true
    critical_type: clinical_action
    evidence: [p3_fall, c3_fall, x3_gait]
    description: >
      Treats the third fall as a reason to rethink, not another "mechanical fall": if brain
      imaging is back (enlarged ventricles), refers urgently to neurology or neurosurgery for
      normal pressure hydrocephalus assessment (tap test); if imaging was never done, arranges
      it now and expedites the assessment.
  - id: v3_carer
    visit: 3
    kind: must_do
    weight: 3
    stage: history
    critical: true
    critical_type: clinical_action
    evidence: [c3_breaking, c_coping]
    description: >
      Asks Carol how she herself is coping, hears that she is at breaking point, and arranges
      real support (home health aide or personal care, respite, a social worker or caregiver
      support, night-time continence products), rather than only managing Gene.
    requires: {spoke_to: [carer]}

  # Non-critical items.
  - id: v1_watch_gait
    visit: 1
    kind: must_do
    weight: 2
    stage: examination
    description: Watches him walk and turn, and checks lying and standing blood pressure.
    requires: {examined: [x_gait, x_orthostatic]}
  - id: v1_ask_carol_seen
    visit: 1
    kind: must_do
    weight: 2
    stage: history
    description: >
      Asks Carol what she has seen of his walking, the summer change and how often he is wet,
      rather than accepting "clumsy" and "the odd accident".
    requires: {spoke_to: [carer]}
  - id: v1_falls_pt
    visit: 1
    kind: must_do
    weight: 2
    stage: plan
    description: >
      Arranges falls work through US routes: home health or outpatient physical and
      occupational therapy (home safety, bathroom), and a geriatrics or falls clinic referral
      where available.
  - id: v1_prostate
    visit: 1
    kind: must_do
    weight: 1
    stage: history
    description: Considers the prostate cancer history (asks about back pain and leg or saddle symptoms; PSA) before blaming the bladder on it.
  - id: v1_more_donepezil
    visit: 1
    kind: must_not_do
    weight: 3
    stage: plan
    description: Increases donepezil or adds memantine for "worsening Alzheimer's".
  - id: v1_more_anticholinergic
    visit: 1
    kind: must_not_do
    weight: 3
    stage: plan
    description: Increases oxybutynin or adds another bladder anticholinergic.
  - id: v2_explain
    visit: 2
    kind: must_do
    weight: 2
    stage: plan
    description: Explains why the scan is being done and that some causes of this picture are treatable.
  - id: v2_carer_check
    visit: 2
    kind: must_do
    weight: 1
    stage: history
    description: Asks how Carol is managing at night.
  - id: v2_alzheimers_only
    visit: 2
    kind: must_not_do
    weight: 3
    stage: plan
    description: Puts the unchanged picture down to worsening Alzheimer's and changes only dementia medicines.
  - id: v3_treatable
    visit: 3
    kind: must_do
    weight: 2
    stage: plan
    description: Tells Gene and Carol that the suspected cause may be treatable, without promising a cure.
  - id: v3_home_safety
    visit: 3
    kind: must_do
    weight: 2
    stage: plan
    description: >
      Addresses the bathroom and night-time hazards (grab rails, night light, commode or
      urinal by the bed, bath mat) through PT/OT or equipment orders.
    requires: {examined: [x3_home]}
  - id: v3_nursing_home
    visit: 3
    kind: must_not_do
    weight: 2
    stage: plan
    description: Recommends a nursing home before the reversible cause is assessed and support at home is tried.
  - id: v3_mechanical_again
    visit: 3
    kind: must_not_do
    weight: 3
    stage: plan
    description: Records another "mechanical fall" with no further assessment or referral.
