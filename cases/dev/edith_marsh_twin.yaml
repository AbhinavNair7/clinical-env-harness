rubric:
  # The base case's clinical_action criticals, unchanged (the validator checks this).
  # v1_ask_daughter is dropped: with every source accurate there is nothing to detect.
  - id: v1_reconcile_meds
    visit: 1
    kind: must_do
    weight: 3
    stage: records
    critical: true
    critical_type: clinical_action
    description: >
      Reconciles medicines across the discharge summary, GP record, dosette and what Edith
      takes; stops furosemide with a rationale (postural hypotension, falls, no heart
      failure) and arranges for the pharmacy to remove it from the dosette.
  - id: v1_falls_function
    visit: 1
    kind: must_do
    weight: 3
    stage: examination
    critical: true
    critical_type: clinical_action
    description: >
      Falls and function assessment: checks lying and standing blood pressure and gait, and
      refers to the falls service or community physiotherapy and occupational therapy.
    requires: {examined: [x_postural_bp, x_gait]}
  - id: v2_confusion
    visit: 2
    kind: red_flag
    weight: 3
    stage: triage
    critical: true
    critical_type: clinical_action
    description: >
      Screens for acute illness (fever, breathlessness, chest pain, head injury, new pain,
      urinary symptoms, eating and drinking); recognises probable delirium after a long lie
      in someone living alone with an unreliable history; arranges a same-day face-to-face
      assessment (home visit), with 999 if red flags appear.

  - id: v1_care_package
    visit: 1
    kind: must_do
    weight: 3
    stage: plan
    critical: true
    critical_type: clinical_action
    description: >
      Reviews whether the care package still fits (short, late evening calls; missed evening
      medicines; no lunch call) and requests a social care reassessment.

  # Non-critical items, as in the base case.
  - id: v1_amlodipine
    visit: 1
    kind: must_do
    weight: 1
    stage: plan
    description: Reviews amlodipine in light of the postural drop (reduce or stop, then recheck BP).
  - id: v1_alarm_hazards
    visit: 1
    kind: must_do
    weight: 1
    stage: plan
    description: Addresses the pendant alarm not being worn and the home hazards.
  - id: v1_evening_meds
    visit: 1
    kind: must_do
    weight: 2
    stage: plan
    description: >
      Plans for missed evening donepezil: moves it to the morning or asks for the call time
      to change.
  - id: v1_carer_assessment
    visit: 1
    kind: must_do
    weight: 1
    stage: plan
    description: Offers Janet a carer's assessment.
  - id: v1_open_ice
    visit: 1
    kind: must_do
    weight: 2
    stage: history
    description: >
      Opens with open questions and finds out what matters to Edith and Janet (ideas,
      concerns, expectations; Edith wants to stay at home) before narrowing down.
  - id: v1_ph_advice
    visit: 1
    kind: must_do
    weight: 1
    stage: plan
    description: >
      Gives conservative postural hypotension advice (stand up slowly, sit to dress, fluids)
      alongside the medicine changes.
  - id: v1_midodrine
    visit: 1
    kind: must_not_do
    weight: 2
    stage: plan
    description: Starts midodrine or fludrocortisone before stopping or reducing the culprit medicines.
  - id: v1_bppv
    visit: 1
    kind: must_not_do
    weight: 2
    stage: examination
    description: Puts her dizziness down to the old BPPV without checking lying and standing BP.
  - id: v1_continue_furosemide
    visit: 1
    kind: must_not_do
    weight: 3
    stage: plan
    description: Continues furosemide.
  - id: v1_care_home
    visit: 1
    kind: must_not_do
    weight: 2
    stage: plan
    description: Recommends a care home before a care reassessment and falls work-up.
  - id: v2_verify_change
    visit: 2
    kind: must_do
    weight: 3
    stage: follow_up
    description: >
      Checks whether furosemide is still in the dosette (pharmacy record or asks Janet to read
      the pods) instead of assuming the visit-1 change happened, and acts on it the same day.
  - id: v2_urgent_care
    visit: 2
    kind: must_do
    weight: 2
    stage: plan
    description: Requests an urgent social care review or short-term increase in care.
  - id: v2_phone_only
    visit: 2
    kind: must_not_do
    weight: 3
    stage: triage
    description: Manages the new confusion by phone alone, with no assessment arranged.
