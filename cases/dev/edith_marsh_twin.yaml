# Consistent-sources twin of edith_marsh (DECISIONS.md, "Pilot population and
# mechanism check"). Truth, personas and visits come from edith_marsh.yaml; only the views and
# rubric are rewritten. Every source is accurate and the problems are in plain view.
id: edith_marsh_twin
twin_of: edith_marsh
title: Edith Marsh (twin) - falls and a dosette, with every source telling the truth
messiness: mild
record_traits:
  gp_record: [long_noisy]

views:
