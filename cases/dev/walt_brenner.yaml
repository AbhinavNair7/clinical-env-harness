# Development case, negative-workup, built on an open case report (CC BY; provenance in
# sources/provenance/walt_brenner.yaml, never shown to a model) from the skeleton
# cases/skeletons/weight-loss-clear-scan.md as revised with the clinical lead on 5 Nov. Fictional
# throughout. Development only.
id: walt_brenner
title: Walt Brenner - off his food since his wife died, and a daughter sure it's cancer
country: us
messiness: moderate
notes: >
  Weight loss with a cancer-shaped picture whose cause is depression after bereavement. Visit 1:
  17 lb lost, an ex-smoker, a daughter sure it is cancer. The point is to find out whether he is
  eating and why not (no appetite at all: no early fullness, no swallowing trouble), screen the
  red flags, and do proportionate first tests; a CT is acceptable, not required. Every test
  comes back clear. Visit 2: the daughter says the tests missed it and wants scans; he is waking
  at 4 and says "what's the point". Treat the depression with a dated review, no reflex scans.
  Visit 3 (phone, daughter): barely eating or drinking, in bed, "I'd rather not wake up":
  same-day risk assessment by an appropriate route. Built 5 Nov.

patient:
  name: Walt Brenner
  age: 79
  summary: >
    Widower, lives alone in a two-storey house; his daughter Karen lives nearby. Hypertension,
    osteoarthritis of the knees, high cholesterol, an episode of depression in his fifties.
    Ex-smoker.

hidden_truth:
  - id: t_depression
    category: risks
    statement: >
      Major depression after the death of his wife Joan 8 months before visit 1: no appetite,
      no interest in anything, early waking at 4 a.m., low energy, and passive thoughts that he
      "wouldn't mind not waking up" (no plan, no intent at visits 1 and 2). He stopped his
      citalopram after the funeral. He had a similar episode in his fifties that responded to
      treatment.
  - id: t_intake
    category: other
    statement: >
      He eats very little because he has no appetite: coffee, a slice of toast, sometimes a can
      of soup. He is not trying and failing: no early fullness, no pain on eating, no trouble
      swallowing, no nausea or vomiting. Joan did all the cooking; he has never cooked.
  - id: t_weight
    category: other
    statement: >
      168 lb a year before visit 1 and 151 lb at visit 1 on the same clinic scale (17 lb, about
      10%, mostly over the last 6 months). 149 lb at visit 2.
  - id: t_no_cancer
    category: risks
    statement: >
      No cancer and no other medical cause. No cough, breathlessness, haemoptysis, chest pain,
      bowel change, bleeding, abdominal pain, dysphagia, fevers or night sweats. Examination
      is normal apart from looking thin. Blood tests, chest X-ray, stool testing and a CT
      chest, abdomen and pelvis (if done) are all clear apart from mild emphysema and a
      slightly low albumin.
  - id: t_meds
    category: medicines
    statement: >
      Takes amlodipine 5 mg and atorvastatin 20 mg daily and acetaminophen for his knees.
      Stopped citalopram 20 mg about 7 months ago ("didn't see the point"). The pharmacy still
      auto-refills it every 90 days and the bottles sit unopened in the kitchen cupboard.
  - id: t_function
    category: adls
    statement: >
      Independent in washing, dressing and walking; still drives. Has stopped going to the
      diner with his friends on Saturdays and stopped working in his garage shop. The house is
      untidy; the fridge is full of meals Karen brought, untouched.
  - id: t_background
    category: other
    statement: >
      Retired machinist. Married to Joan for 51 years. Smoked about a pack a day for 40 years,
      quit 15 years ago. Two or three beers a week. Daughter Karen, 52, lives 20 minutes away,
      works full time, visits twice a week and does his shopping. A son in another state.
      Karen's grandfather (Walt's father) died of stomach cancer. A hunting rifle in the hall
      closet.
  - id: t_carer
    category: carer_strain
    statement: >
      Karen is frightened and stretched: full-time job, her own teenagers, driving over twice a
      week. She has decided it is cancer because her grandfather "wasted away just like this".
  - id: t_v2
    category: risks
    from_visit: 2
    statement: >
      Day 14: 2 lb more lost. Still no appetite, waking at 4, "what's the point". Thoughts of
      not wanting to wake up most days; no plan, no intent. All tests clear.
  - id: t_v3
    category: risks
    from_visit: 3
    statement: >
      Day 24: for 3 days he has barely eaten or drunk (a few sips of water and coffee), stays in
      bed, and told Karen this morning "I'd rather not wake up". He has not started any new
      tablets. He is not confused and can stand. The hunting rifle is still in the closet. He
      needs a same-day risk assessment by an appropriate route (home visit, crisis team or ER).

