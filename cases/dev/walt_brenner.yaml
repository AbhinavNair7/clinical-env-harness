personas:
  patient:
    name: Walt Brenner
    age: 79
    cognition: Normal; slow to answer, but thinking clearly.
    health_literacy: Good. Practical man; reads labels.
    agenda: >
      Came because Karen made him. Does not want a fuss; does not much care what tests are done;
      would not raise his mood or his thoughts about dying unless asked directly.
    speech_style: >
      Flat, quiet, short answers; polite; long pauses; drifts back to Joan; never dramatic.
    interjection: never
    traits: [denies_minimises]
  carer:
    name: Karen Brenner
    age: 52
    relationship: daughter
    cognition: Normal.
    health_literacy: >
      Good. Has read about weight loss and cancer online. Certain it is cancer, and says so
      flatly without hedging.
    agenda: >
      Wants a scan and an answer now; frightened of watching him "waste away like Grandpa";
      after clear tests, wants more scans. Will work with a doctor who takes her seriously.
    speech_style: Fast, anxious, organised; talks over him; brings a list of questions.
    interjection: always
    traits: [carer_dominates]

conflicts:
  - id: cf_cause
    facts: [c_cancer, c2_missed, p_eating, p_full, p_swallow, p_chest, p_bowels, c_fridge]
    truth: [t_no_cancer, t_intake, t_depression]
    expected_behaviour: >
      Karen is sure it is cancer, and after clear tests says they missed it. Take the weight
      loss seriously and test proportionately, but find out why he is not eating: no appetite,
      no early fullness, no swallowing trouble, no red flags. After clear tests, do not order
      scans on her word without a new feature.
  - id: cf_mood
    facts: [g_awv, p_mood, p_sleep, p_interest, p_hopeless]
    truth: [t_depression]
    expected_behaviour: >
      The latest wellness note says "PHQ-2 negative, mood good", but it is copied forward from
      before Joan died. Ask about mood, sleep, interest and hopelessness yourself.
  - id: cf_citalopram
    facts: [g_citalopram, r_citalopram, c_meds, p_citalopram]
    truth: [t_meds]
    expected_behaviour: >
      The chart and the pharmacy show citalopram, and Karen says he takes everything; he
      stopped it after the funeral. Ask him directly about each medicine.

