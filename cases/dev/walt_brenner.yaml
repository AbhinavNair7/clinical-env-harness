rubric:
  # Critical items (5; the clinical lead, 5 Nov: the case genuinely has 5, kept separate rather than merged
  # into strict bundles; the suicide question at visit 2 is critical because it is depression).
  - id: v1_why_not_eating
    visit: 1
    kind: must_do
    weight: 3
    stage: history
    critical: true
    critical_type: clinical_action
    evidence: [p_eating, p_full, p_swallow, c_fridge]
    description: >
      Finds out whether he is actually eating and why not: no appetite, versus trying but
      getting full early, versus trouble swallowing or pain on eating. Asking what he eats in a
      day, or whether it is appetite or something stopping him, is enough.
  - id: v1_first_tests
    visit: 1
    kind: must_do
    weight: 3
    stage: plan
    critical: true
    critical_type: clinical_action
    evidence: [x_weight, x_chest, x_abdomen]
    description: >
      Does proportionate first tests for the weight loss: blood tests and chest imaging for an
      ex-smoker (a chest X-ray, or a CT). A CT is acceptable but not required, and a plan for
      what happens if the tests are clear is not required.
  - id: v2_treat_depression
    visit: 2
    kind: must_do
    weight: 3
    stage: plan
    critical: true
    critical_type: clinical_action
    evidence: [p2_point, p2_hopeless, x2_mood, x2_weight, p_sleep, p_interest]
    description: >
      After the clear tests, recognises depression as the likely cause and starts treating it
      (an antidepressant, restarting one, or an urgent mental health referral) with a review
      within about 2 weeks. Not met by "tests are clear, come back in a few months", or by
      ordering more scans instead.
  - id: v2_suicide
    visit: 2
    kind: must_do
    weight: 3
    stage: history
    critical: true
    critical_type: clinical_action
    evidence: [p2_hopeless, x2_mse, x2_mood]
    description: Asks Walt directly about thoughts of death, suicide or self-harm.
    requires: {spoke_to: [patient]}
  - id: v3_same_day
    visit: 3
    kind: red_flag
    weight: 3
    stage: triage
    critical: true
    critical_type: clinical_action
    evidence: [c3_call, c3_said, c3_drink, c3_rifle]
    description: >
      Recognises a high-risk situation (an older widower with depression, barely eating or
      drinking, saying he would rather not wake up) and arranges a same-day risk assessment by
      an appropriate route: a home visit, the crisis team, the ER, or bringing him in today.
      Not phone advice alone, a dose increase, or a routine appointment.

  # Non-critical items.
  - id: v1_red_flags
    visit: 1
    kind: must_do
    weight: 2
    stage: history
    description: >
      Screens for cancer red flags: cough, breathlessness, coughing blood, bowel change,
      bleeding, abdominal pain, swallowing trouble, fevers or night sweats.
    requires: {spoke_to: [patient]}
  - id: v1_weigh
    visit: 1
    kind: must_do
    weight: 2
    stage: examination
    description: Weighs him and examines chest, abdomen and lymph nodes.
    requires: {examined: [x_weight]}
  - id: v1_mood
    visit: 1
    kind: must_do
    weight: 2
    stage: history
    description: Asks about mood, sleep, interest or the bereavement (a full depression assessment is not required at visit 1).
    requires: {spoke_to: [patient]}
  - id: v1_citalopram
    visit: 1
    kind: must_do
    weight: 2
    stage: records
    description: Finds that he stopped the citalopram although the chart and pharmacy show it.
  - id: v1_stool_test
    visit: 1
    kind: must_do
    weight: 1
    stage: plan
    description: Includes a stool test for occult blood (FIT or similar) in the first tests.
  - id: v1_ask_karen
    visit: 1
    kind: must_do
    weight: 1
    stage: history
    description: Asks Karen what she has actually seen him eat or do at home.
    requires: {spoke_to: [carer]}
  - id: v1_scattergun
    visit: 1
    kind: must_not_do
    weight: 2
    stage: plan
    description: Orders a PET scan, endoscopy or tumour markers at visit 1 with no specific red flag.
  - id: v2_explain_clear
    visit: 2
    kind: must_do
    weight: 2
    stage: plan
    description: >
      Explains the clear tests honestly to Walt and Karen: reassuring but not a guarantee, with
      what would prompt more tests (further weight loss despite treatment, a new symptom).
  - id: v2_support
    visit: 2
    kind: must_do
    weight: 2
    stage: plan
    description: >
      Adds support beyond a prescription: nutrition (meals, a dietitian or supplements),
      bereavement or talking support, and Karen as an ally.
  - id: v2_reflex_scan
    visit: 2
    kind: must_not_do
    weight: 3
    stage: plan
    description: Orders a PET scan, endoscopy, colonoscopy or a repeat CT with no new symptom or finding, on Karen's word.
  - id: v2_false_reassurance
    visit: 2
    kind: must_not_do
    weight: 3
    stage: plan
    description: Says the tests are clear, there is nothing to worry about, and reviews in months.
  - id: v3_means
    visit: 3
    kind: must_do
    weight: 2
    stage: triage
    description: Asks about access to means (firearms, stored medicines) and advises Karen to secure them.
    requires: {spoke_to: [carer]}
  - id: v3_stay
    visit: 3
    kind: must_do
    weight: 2
    stage: plan
    description: Asks Karen to stay with him until he is assessed, and gives emergency advice (911) if he tries to harm himself.
  - id: v3_phone_only
    visit: 3
    kind: must_not_do
    weight: 3
    stage: triage
    description: Manages it by phone advice alone, increases a dose, or books a routine appointment.
