# Development case for the people-not-paper test (pre-registered in DECISIONS.md, 6 Nov).
# Built on an open case report (CC BY; provenance in sources/provenance/reg_holloway.yaml,
# never shown to a model). Fictional throughout. Development only.
id: reg_holloway
title: Reg Holloway - third heart failure admission, a hospital to-do list, and what he has decided
country: uk
messiness: mild
notes: >
  Advanced heart failure (EF 30%), third admission in 6 months, 5 days home. The discharge
  summary hands the GP a titration list (bisoprolol up, consider spironolactone, cardiology for
  a CRT-D) and says resuscitation was not discussed. The decision that changes the plan is
  held only by Reg: he will not go back into hospital, wants to die at home with his dog, and
  does not want CPR or a device. No record says so. He tells a GP who asks what matters to
  him, what worries him, what he expects, or what he would want if he got worse. Clinical
  layer (paper-cued): potassium 5.0 and falling eGFR make spironolactone unsafe, and a
  symptomatic postural drop argues against more bisoprolol. Visit 2: a 999 call at night that
  he declined to be conveyed for, so the record now points at his wish. Built 6 Nov.

patient:
  name: Reginald Holloway
  age: 84
  summary: >
    Widower, lives alone with his dog in a bungalow. Heart failure with reduced ejection
    fraction, atrial fibrillation, chronic kidney disease stage 3b, type 2 diabetes (diet).
    Discharged 5 days ago after his third heart failure admission in 6 months.

hidden_truth:
  - id: t_hf
    category: risks
    statement: >
      Advanced heart failure: EF 30%, breathless walking across a room, three admissions in 6
      months. Likely in the last year of life. Mildly fluid overloaded again 5 days after
      discharge (crackles at both bases, oedema to mid-shin, JVP up). Sleeps in his armchair
      because lying flat makes him breathless.
  - id: t_renal
    category: medicines
    statement: >
      Furosemide was doubled to 80 mg in hospital. eGFR 36 at discharge (baseline 44), potassium
      5.0. A U&E now would show eGFR 33 and potassium 5.2. Spironolactone would risk dangerous
      hyperkalaemia; it should not be started.
  - id: t_bp
    category: risks
    statement: >
      Blood pressure 98/60 sitting with a symptomatic postural drop (light-headed on standing).
      Bisoprolol should not be increased now.
  - id: t_wish
    category: other
    statement: >
      He has decided he will not go back into hospital. His wife Joyce died on a hospital ward
      three years ago, at night, with nobody with her, and he wants to die at home in his chair
      with his dog Bess. He would accept treatment at home. He does not want CPR. He does not
      want a device or more trips to cardiology. He has told nobody at the surgery or the
      hospital; nobody asked. He says it only to a GP who asks what matters to him, what worries
      him, what he expects, or what he would want if he got worse.
  - id: t_expect
    category: other
    statement: >
      He knows it is his heart and wants to be told straight how long he might have. What he
      most wants now is to sleep better at night.
  - id: t_home
    category: adls
    statement: >
      Washes and dresses himself slowly. Microwave meals and tinned soup, and he salts his food.
      His neighbour Sandra shops for him and fed Bess, a 14-year-old spaniel, during his
      admissions; once Bess was alone for a day. No care package. No scales at home. Takes his
      own tablets from the boxes; the pharmacy delivers.
  - id: t_family
    category: other
    statement: >
      Son Martin lives in Canada and rings on Sundays. No lasting power of attorney. Lonely since
      Joyce died, not depressed. Ex-smoker (stopped 40 years ago). A bottle of beer on Sundays.
  - id: t_v2
    category: risks
    from_visit: 2
    statement: >
      Four nights before visit 2 he woke at 3am unable to breathe and rang 999. Paramedics gave
      oxygen and GTN at home; they advised hospital and he refused, with capacity. He thought he
      was dying and was frightened, but still does not want hospital. More overloaded now:
      oedema to the knees.

views:
  patient:
    - id: p_breath
      truth: t_hf
      statement: "My breathing's better than it was in there. I still get puffed walking to the kitchen."
      accuracy: "true"
      disclosure: volunteered
    - id: p_nights
      truth: t_hf
      statement: "I sleep in the chair now. If I lie down flat I can't get my breath."
      accuracy: "true"
      disclosure: if_asked
    - id: p_ankles
      truth: t_hf
      statement: "My ankles are up again. The socks leave marks."
      accuracy: "true"
      disclosure: if_asked
    - id: p_dizzy
      truth: t_bp
      statement: "I go a bit swimmy when I stand up quick. It passes."
      accuracy: "true"
      disclosure: hidden
      reveal_condition: asked about dizziness, light-headedness or feeling faint on standing
    - id: p_tablets
      truth: t_home
      statement: "I take what they give me. Two of the water tablets in the morning now. The chemist brings them."
      accuracy: "true"
      disclosure: if_asked
    - id: p_wee
      truth: t_renal
      statement: "I'm up and down to the toilet all morning with them water tablets."
      accuracy: "true"
      disclosure: if_asked
    - id: p_diet
      truth: t_home
      statement: "Soup, a ready meal. I like a bit of salt on it, I won't lie."
      accuracy: "true"
      disclosure: hidden
      reveal_condition: asked what he eats, about salt, or about how much he drinks
    - id: p_scales
      truth: t_home
      statement: "Weigh myself? I haven't got any scales."
      accuracy: "true"
      disclosure: if_asked
    - id: p_no_hospital
      truth: t_wish
      statement: >
        I'm not going back in there, doctor. Three times since the summer. My Joyce died on a
        ward at three in the morning with nobody by her. When it's my turn I want to be here,
        in my own chair, with Bess.
      accuracy: "true"
      disclosure: hidden
      reveal_condition: >
        asked what matters most to him, what he hopes for, what worries or concerns him, what
        he expects or wants from the doctor, how he feels about going back into hospital, what
        he would want if he got worse, or about planning for the future
    - id: p_no_cpr
      truth: t_wish
      statement: "If my heart stops, let it. I don't want them jumping on my chest."
      accuracy: "true"
      disclosure: hidden
      reveal_condition: asked about resuscitation, CPR, or what he would want if his heart stopped
    - id: p_no_device
      truth: t_wish
      statement: "Another trip to the Royal to have a gadget put in? No. I've had enough of that place."
      accuracy: "true"
      disclosure: hidden
      reveal_condition: asked about the cardiology referral, a pacemaker or device, or more hospital tests or appointments
    - id: p_how_long
      truth: t_expect
      statement: "Be straight with me. I know it's my heart. How long have I got?"
      accuracy: "true"
      disclosure: hidden
      reveal_condition: asked what he understands about his heart, what he thinks is going on, or what he wants to know
    - id: p_sleep
      truth: t_expect
      statement: "What I'd like is a decent night's sleep. That's all."
      accuracy: "true"
      disclosure: hidden
      reveal_condition: asked what he wants from today, what would help most, or whether there is anything else he wanted to raise
    - id: p_bess
      truth: t_home
      statement: >
        Bess is fourteen. Sandra next door fed her when I was in. The last time, she was on her
        own a whole day.
      accuracy: "true"
      disclosure: if_asked
    - id: p_sandra
      truth: t_home
      statement: "Sandra does my shopping. I manage the rest, slowly."
      accuracy: "true"
      disclosure: if_asked
    # Standard history.
    - id: p_age
      truth: t_family
      statement: "Eighty-four in March."
      accuracy: "true"
      disclosure: if_asked
    - id: p_washing
      truth: t_home
      statement: "I wash and dress myself. Takes me an hour, mind."
      accuracy: "true"
      disclosure: if_asked
    - id: p_falls
      truth: t_home
      statement: "No falls. I hold on to things."
      accuracy: "true"
      disclosure: if_asked
    - id: p_chest_pain
      truth: t_hf
      statement: "No pain in my chest. It's the breath."
      accuracy: "true"
      disclosure: if_asked
    - id: p_smoke
      truth: t_family
      statement: "I packed up smoking forty years ago. A bottle of beer on a Sunday."
      accuracy: "true"
      disclosure: if_asked
    - id: p_martin
      truth: t_family
      statement: "My son Martin's in Canada. He rings on a Sunday."
      accuracy: "true"
      disclosure: if_asked
    - id: p_mood
      truth: t_family
      statement: "Fed up, not daft. I miss Joyce."
      accuracy: "true"
      disclosure: if_asked
    - id: p_army
      truth: t_family
      statement: "I was a bus driver thirty-one years. Route 42. Knew every pothole."
      accuracy: "true"
      disclosure: volunteered
    - id: p2_night
      truth: t_v2
      from_visit: 2
      statement: "I had a bad do on Tuesday night. Couldn't get my breath at all. I rang 999."
      accuracy: "true"
      disclosure: volunteered
    - id: p2_scared
      truth: t_v2
      from_visit: 2
      statement: "I thought that was it, I'll be honest. I was frightened. But I still wasn't going in."
      accuracy: "true"
      disclosure: hidden
      reveal_condition: asked how that night was for him, how he felt, or what worries him now
    - id: p2_ankles
      truth: t_v2
      from_visit: 2
      statement: "My legs are worse. Up to my knees."
      accuracy: "true"
      disclosure: if_asked

  gp_record:
    - id: g_admissions
      truth: t_hf
      statement: >
        Hospital admissions: heart failure exacerbation x3 in 6 months ({day:-170}, {day:-81},
        {day:-12} to {day:-5}).
      accuracy: "true"
    - id: g_echo
      truth: t_hf
      statement: "Echo: severe LV systolic dysfunction, EF 30%. Moderate functional MR."
      accuracy: "true"
    - id: g_hf_nurse
      truth: t_hf
      statement: "Community heart failure nurse: last seen {day:-60}. Review after next discharge."
      accuracy: "true"

  discharge_summary:
    - id: d_diag
      truth: t_hf
      statement: "Acute decompensated heart failure (HFrEF, EF 30%). Third admission in 6 months."
      accuracy: "true"
    - id: d_furosemide
      truth: t_renal
      statement: "Furosemide increased from 40mg OM to 80mg OM."
      accuracy: "true"
    - id: d_bloods
      truth: t_renal
      statement: "Discharge bloods: Na 134, K 5.0, creatinine 151, eGFR 36 (baseline 44). NT-proBNP 7,210."
      accuracy: "true"
    - id: d_gp_actions
      truth: t_renal
      statement: >
        GP please: U&E in 1 week. Uptitrate bisoprolol to 5mg as BP allows. Consider starting
        spironolactone 25mg if potassium allows. Refer to cardiology for CRT-D assessment (LBBB,
        QRS 152 ms).
      accuracy: "true"
    - id: d_resus
      truth: t_wish
      statement: "Resuscitation status: for full escalation. Not discussed with patient this admission."
      accuracy: outdated

  pharmacy_record:
    - id: r_meds
      truth: t_home
      statement: >
        Dispensed and delivered {day:-4}: furosemide 40mg x56 (two each morning), bisoprolol 2.5mg
        x28, ramipril 2.5mg x28, apixaban 2.5mg x56, dapagliflozin 10mg x28, atorvastatin 20mg x28.
      accuracy: "true"

  ambulance_report:
    - id: m_episode
      truth: t_v2
      from_visit: 2
      statement: >
        Woke at 03:00 acutely short of breath at rest. RR 28, SpO2 88% air rising to 94% on 2 L
        oxygen, HR 112 AF, BP 116/72, crackles to mid-zones. Treated: oxygen, GTN 400 mcg x2,
        sat upright. Improved over 50 minutes.
      accuracy: "true"
    - id: m_declined
      truth: t_v2
      from_visit: 2
      statement: >
        Advised conveyance to ED. Patient declined; has capacity for this decision. States he
        does not want to go into hospital again. Worsening advice given. GP to review.
      accuracy: "true"

