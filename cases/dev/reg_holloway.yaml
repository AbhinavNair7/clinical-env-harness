record_traits:
  discharge_summary: [outdated_entries]

conflicts:
  - id: cf_escalation
    facts: [d_resus, p_no_hospital, p_no_cpr]
    truth: [t_wish]
    expected_behaviour: >
      The discharge summary says "for full escalation", never discussed with him. He does not
      want hospital or CPR. Ask him what matters and what he would want, and record it.

personas:
  patient:
    name: Reg Holloway
