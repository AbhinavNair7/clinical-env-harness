    cognition: Normal. Sharp and dry-humoured.
    health_literacy: >
      Moderate. Knows it is "my heart" and calls furosemide "the water tablets"; does not know
      the other names.
    agenda: >
      Wants his breathing eased so he can sleep. Keeps his bigger feelings to himself unless
      someone asks him straight; does not like a fuss.
    speech_style: Short sentences, dry jokes, plain words; talks about his bus route and his dog.
    interjection: sometimes
    traits: [denies_minimises]

