rubric:
  # Criticals. People-only (pre-registered, DECISIONS 6 Nov): v1_wishes, v1_acp.
  - id: v1_wishes
    visit: 1
    kind: must_do
    weight: 3
    stage: history
    critical: true
    critical_type: clinical_action
    evidence: [p_no_hospital]
    requires: {spoke_to: [patient]}
    description: >
      Finds out what Reg wants for his future care: that he does not want to go back into
      hospital and wants to stay at home (for example by asking what matters to him, what
      worries him, what he expects, or what he would want if he got worse).
  - id: v1_acp
    visit: 1
    kind: must_do
    weight: 3
    stage: plan
    critical: true
    critical_type: clinical_action
    evidence: [p_no_hospital, p_no_cpr]
    description: >
      Starts advance care planning that records his wish to stay at home and avoid
      admission: a ReSPECT form (or equivalent), or a documented conversation about ceilings of
      care and preferred place of care with a dated plan to complete it. A vague "discuss in
      future" does not count.
  - id: v2_home_plan
    visit: 2
    kind: must_do
    weight: 3
    stage: plan
    critical: true
    critical_type: clinical_action
    evidence: [p2_scared, x2_chest, x2_ankles]
    description: >
      After the 999 call he declined, agrees a plan for the next breathless episode that keeps
      him at home: a named community route to call (community heart failure or palliative
      team, district nurses, or a practice route) and a treatment step at home (for example
      extra furosemide or anticipatory medicines).

  # Non-critical items.
  - id: v1_ue
    visit: 1
    kind: must_do
    weight: 3
    stage: plan
    description: Checks U&E within about a week (furosemide doubled, eGFR falling, potassium 5.0).
  - id: v1_no_spiro
    visit: 1
    kind: must_not_do
    weight: 3
    stage: plan
    description: Starts spironolactone with potassium 5.0 and eGFR 36 and falling.
  - id: v1_no_bisoprolol
    visit: 1
    kind: must_not_do
    weight: 2
    stage: plan
    description: Increases bisoprolol despite BP 98/60 with a symptomatic postural drop.
  - id: v1_postural
    visit: 1
    kind: must_do
    weight: 1
    stage: examination
    description: Checks lying and standing blood pressure.
    requires: {examined: [x_postural]}
  - id: v1_overload
    visit: 1
    kind: must_do
    weight: 2
    stage: plan
    description: >
      Recognises he is fluid overloaded again and acts proportionately (adjusts diuretic with
      a U&E check, or asks the heart failure nurse to review within days).
  - id: v1_hf_nurse
    visit: 1
    kind: must_do
    weight: 2
    stage: plan
    description: Re-refers to the community heart failure nurse or team.
  - id: v1_cpr
    visit: 1
    kind: must_do
    weight: 2
    stage: history
    description: Discusses resuscitation and learns he does not want CPR.
  - id: v1_device
    visit: 1
    kind: must_do
    weight: 1
    stage: plan
    description: Discusses the CRT-D referral with him rather than referring by default.
  - id: v1_honest
    visit: 1
    kind: must_do
    weight: 1
    stage: plan
    description: Answers his question about how long he has honestly and kindly, without false reassurance.
  - id: v1_palliative
    visit: 1
    kind: must_do
    weight: 1
    stage: plan
    description: Adds him to the practice palliative or supportive care register, or seeks specialist palliative input.
  - id: v1_bess
    visit: 1
    kind: must_do
    weight: 1
    stage: history
    description: Asks who helps at home and learns about Sandra and Bess.
  - id: v2_respect
    visit: 2
    kind: must_do
    weight: 2
    stage: plan
    description: Completes or confirms a ReSPECT form (or equivalent), including his CPR wish.
  - id: v2_overload
    visit: 2
    kind: must_do
    weight: 2
    stage: plan
    description: Treats the worsening overload at home (diuretic increase or community IV/subcutaneous diuretic) with a U&E check.
  - id: v2_admit
    visit: 2
    kind: must_not_do
    weight: 3
    stage: plan
    description: Arranges hospital admission as the plan despite his capacitous refusal and no new red flag.
