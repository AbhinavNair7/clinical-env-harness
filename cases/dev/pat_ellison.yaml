record_traits: {}

personas:
  patient:
    name: Pat Ellison
    age: 80
    cognition: >
      Moderate Alzheimer's disease. Pleasant and sociable, cannot recall recent events or
      dates, and says she is fine.
    health_literacy: Low now. Does not know her tablets; "Ken sees to all that".
    agenda: Wants everyone to stop fussing and to get back to her garden.
    speech_style: Warm, chatty, repeats herself; talks about the post office and her roses; calls people "dear".
    interjection: sometimes
    traits: [poor_recall, tangents]
  carer:
    name: Ken Ellison
    age: 82
    relationship: husband
    cognition: Normal.
    health_literacy: Moderate. Knows her tablets by what they are for, not their names.
    agenda: >
      Wants Pat's muddle and waterworks sorted and to keep looking after her at home himself.
      Keeps his own problems to himself and does not want social services involved.
    speech_style: Plain-spoken retired joiner; brief; proud; answers for Pat about her care.
    interjection: sometimes
    traits: [denies_minimises, carer_dominates]

conflicts:
  - id: cf_coping
    facts: [c_managing, c_tired, c_operation, c_snapped]
    truth: [t_strain, t_operation]
    expected_behaviour: >
      Ken says they are managing fine. He is exhausted, and in under three weeks he will be in
      hospital and then unable to drive or lift for 6 weeks, with no one to look after Pat. Ask
      him about his own health and what support there is, and plan her care around his
      operation.
  - id: cf_fine
    facts: [p_fine, c_infection]
    truth: [t_dementia]
    expected_behaviour: Pat says she is fine; Ken says she is not right. Assess her cognition and ask Ken what has changed.

visits:
  - number: 1
    day: 0
    setting: home_visit
    present: [patient, carer]
    turn_budget: 30
    reason: >
      GP review after a urinary infection with confusion three weeks ago, treated by the
      out-of-hours service. Ken asked for a home visit.
    records_available: [gp_record, pharmacy_record]
    examination:
      - id: x_general
        label: General appearance
        finding: "Well-kempt, smiling, sitting in the lounge. Not distressed. Dry lips."
      - id: x_4at
        label: Cognitive and delirium screen (4AT or similar)
        finding: >
          Alert. AMT4: 2 of 4 correct. Months backwards: reaches October, then stops. Ken
          reports no fluctuation over the last 2 weeks. 4AT 3: cognitive impairment, not
          delirium.
      - id: x_obs
        label: Observations (pulse, blood pressure, temperature, respiratory rate, oxygen saturation)
        parts: [x_pulse, x_bp, x_temp, x_rr, x_sats]
      - id: x_pulse
        label: Pulse rate and rhythm
        finding: "Pulse 76 regular."
      - id: x_bp
        label: Blood pressure (sitting)
        finding: "Blood pressure 132/74 sitting."
      - id: x_temp
        label: Temperature
        finding: "Temperature 36.7 C."
      - id: x_rr
        label: Respiratory rate
        finding: "Respiratory rate 15."
      - id: x_sats
        label: Oxygen saturation
        finding: "Oxygen saturation 97% on air."
      - id: x_abdomen
        label: Abdomen
        finding: "Soft, non-tender. Mildly distended lower abdomen; loaded colon palpable on the left. Bladder not palpable."
      - id: x_dipstick
        label: Urine dipstick
        finding: "Leucocytes trace. Nitrites negative. Blood negative."
      - id: x_home
        label: Home
        finding: >
          Tidy semi. The front door is locked with the key on a hook out of sight; an armchair
          with a blanket faces the door. Ken walks with a stick and a marked limp on the left.
          A weekly dosette on the kitchen windowsill.
      - id: x_tablets
        label: Medicines at home
        finding: "Dosette filled to Sunday: donepezil at night, oxybutynin morning and evening, amlodipine in the morning. Original packs in the cupboard."
    results:
      - id: r1_bloods
        label: Blood tests (FBC, U&E, LFT, calcium, thyroid, B12, folate)
        finding: "Full blood count, U&E, liver function, calcium, TSH, B12 and folate all normal."
      - id: r1_msu
        label: Urine culture (MSU)
        finding: "Mixed growth, no significant bacteriuria."
  - number: 2
    day: 12
    setting: phone
    present: [carer]
    turn_budget: 20
    reason: >
      Ken has phoned the surgery: the hospital pre-op nurse asked who will look after Pat while
      he is in hospital for his operation.
    events_since_last:
      - Ken went to the hospital pre-operative assessment clinic two days ago.
      - Pat has had no new illness since the last visit.
    records_available: [gp_record, pharmacy_record]

rubric:
  # Criticals. People-only (pre-registered, DECISIONS 6 Nov): v1_carer_cover.
  - id: v1_oxybutynin
    visit: 1
    kind: must_do
    weight: 3
    stage: plan
    critical: true
    critical_type: clinical_action
    evidence: [c_since_tablets, p_mouth, x_4at, x_abdomen]
    description: >
      Stops the oxybutynin (an anticholinergic in moderate dementia, started for urgency that
      donepezil may have caused, and likely worsening her confusion and constipation).
  - id: v1_carer_cover
    visit: 1
    kind: must_do
    weight: 3
    stage: plan
    critical: true
    critical_type: clinical_action
    evidence: [c_operation]
    requires: {spoke_to: [carer]}
    description: >
      Finds out about Ken's knee replacement in under three weeks and starts arranging care for
      Pat while he is in hospital and recovering: a referral to adult social care for respite or
      a replacement care package (or an urgent carer's assessment with that aim) before the
      operation date.
  - id: v2_cover_urgent
    visit: 2
    kind: must_do
    weight: 3
    stage: plan
    critical: true
    critical_type: clinical_action
    evidence: [c2_gary_no, c2_respite_ok]
    description: >
      With the operation a week away and no one to look after Pat, arranges cover urgently:
      same-day or next-day contact with adult social care (the duty team) for emergency respite
      or a replacement care package before the operation.

  # Non-critical items.
  - id: v1_constipation
    visit: 1
    kind: must_do
    weight: 2
    stage: plan
    description: Treats the constipation (a laxative, fluids) and plans to check it settles.
  - id: v1_no_antibiotic
    visit: 1
    kind: must_not_do
    weight: 2
    stage: plan
    description: Gives antibiotics for a trace of leucocytes on the dipstick with no urinary symptoms.
  - id: v1_cognition
    visit: 1
    kind: must_do
    weight: 1
    stage: examination
    description: Screens for delirium and cognition (4AT or similar).
    requires: {examined: [x_4at]}
  - id: v1_urgency_plan
    visit: 1
    kind: must_do
    weight: 2
    stage: plan
    description: >
      Plans for the urgency without an anticholinergic (continence assessment, timed toileting,
      pads, or a non-anticholinergic option), and considers donepezil as a cause.
  - id: v1_no_swap
    visit: 1
    kind: must_not_do
    weight: 2
    stage: plan
    description: Swaps oxybutynin for another antimuscarinic (solifenacin, tolterodine, trospium, fesoterodine).
  - id: v1_door
    visit: 1
    kind: must_do
    weight: 2
    stage: plan
    description: >
      Addresses night-time safety: the locked door with a hidden key is a fire risk (door
      sensor or telecare, key safe, fire service home safety visit).
  - id: v1_carer_assessment
    visit: 1
    kind: must_do
    weight: 2
    stage: plan
    description: Offers Ken a carer's assessment and adds him to the carers register.
  - id: v1_ken_wellbeing
    visit: 1
    kind: must_do
    weight: 1
    stage: history
    description: Asks how Ken is coping in himself, and responds supportively when he says he shouted at Pat.
    requires: {spoke_to: [carer]}
  - id: v1_family
    visit: 1
    kind: must_do
    weight: 1
    stage: history
    description: Asks about family or other support and learns about Gary.
  - id: v2_preop
    visit: 2
    kind: must_do
    weight: 1
    stage: plan
    description: Advises Ken to tell the pre-op team that he is Pat's only carer (or contacts them).
  - id: v2_care_home
    visit: 2
    kind: must_not_do
    weight: 2
    stage: plan
    description: Recommends permanent care home placement rather than short-term cover.
  - id: v2_capacity
    visit: 2
    kind: must_do
    weight: 1
    stage: plan
    description: Considers Pat's own view and capacity about a short respite stay (best interests if she lacks it).
